<!DOCTYPE html>
<html>

<head>
<title>Finanzanalyse</title>

<link rel="stylesheet" href="https://pyscript.net/releases/2025.5.1/core.css">
<link rel="stylesheet" href="index.css">
<script type="module" src="https://pyscript.net/releases/2025.5.1/core.js"></script>

<style>
body {
  font-family: Arial, sans-serif;
  margin: 30px auto;
  max-width: 900px;
  color: #e8eef6;
}

#dropzone {
  width: 100%;
  min-height: 250px;
  border: 3px dashed #4a90e2;
  border-radius: 12px;
  padding: 20px;
  text-align: center;
  background-color: #fafafa;
  color: #333;
  margin-top: 20px;
  box-sizing: border-box;
}

#dropzone.dragover {
  background-color: #eef6ff;
  border-color: #005fb8;
}

#dropzone strong {
  font-size: 22px;
  color: #005fb8;
}

.hint {
  margin-top: 15px;
  color: #666;
  font-size: 14px;
}

#startButton {
  margin-top: 20px;
  padding: 10px 20px;
  font-size: 16px;
  background-color: #005fb8;
  color: white;
  border: none;
  border-radius: 6px;
  cursor: pointer;
}

#startButton:hover {
  background-color: #004080;
}

.mindmap {
  margin-top: 30px;
  width: 100%;
}

pre {
  background: #f5f5f5;
  padding: 10px;
  margin-top: 20px;
  overflow-x: auto;
  border-radius: 6px;
}
</style>
</head>

<body>

<h1 style="text-align:center;">Finanzanalyse</h1>
<p style="text-align:center; color:#8aaac8; margin-top:-10px; font-size:15px;">Analysiert die liquiden Mittel und überprüft Unternehmen auf Kredittauglichkeit</p>

<input type="file" id="csvFile" accept=".csv" multiple>

<div id="dropzone">
  <strong>&#128194; Finanzdaten hochladen</strong>

  <p>Für die Analyse werden folgende Dateien benötigt:</p>

  <p>
    ✅ Letzte Bilanz<br>
    ✅ Letzte GuV
  </p>

  <div class="hint">
    CSV-Dateien per Drag &amp; Drop hier ablegen oder über den Upload-Button auswählen.
  </div>
</div>

<button id="startButton">Finanzanalyse starten</button>



<h3>Geladene Datei:</h3>
<pre id="output"></pre>

<script>
const dropzone = document.getElementById("dropzone");
const fileInput = document.getElementById("csvFile");
const output = document.getElementById("output");

let aktuelleDatei = null;

async function readFile(file) {
  aktuelleDatei = file;
  const text = await file.text();
  output.textContent = "Datei: " + file.name + "\n\n" + text.substring(0, 1000);
}

fileInput.addEventListener("change", e => {
  if (e.target.files.length > 0) readFile(e.target.files[0]);
});

dropzone.addEventListener("dragover", e => {
  e.preventDefault();
  dropzone.classList.add("dragover");
});

dropzone.addEventListener("dragleave", () => {
  dropzone.classList.remove("dragover");
});

dropzone.addEventListener("drop", e => {
  e.preventDefault();
  dropzone.classList.remove("dragover");
  const file = e.dataTransfer.files[0];
  if (file && file.name.toLowerCase().endsWith(".csv")) {
    readFile(file);
  } else {
    alert("Bitte eine CSV-Datei auswählen.");
  }
});

</script>

<script type="py">
from pyscript import document

def analyse_starten(event):
    print("Finanzanalyse wird gestartet...")

button = document.getElementById("startButton")
button.addEventListener("click", analyse_starten)
</script>

</body>

</html>
