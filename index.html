<!DOCTYPE html>
<html>

<head>
<title>Finanzanalyse</title>

<link rel="stylesheet" href="https://pyscript.net/releases/2025.5.1/core.css">
<link rel="stylesheet" href="index.css">
<script type="module" src="https://pyscript.net/releases/2025.5.1/core.js"></script>

<style>
body {
  font-family: Arial, sans-serif;
  margin: 30px auto;
  max-width: 900px;
  color: #e8eef6;
}

.upload-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 20px;
  margin-top: 20px;
}

.upload-zone {
  min-height: 180px;
  border: 3px dashed #4a90e2;
  border-radius: 12px;
  padding: 20px;
  text-align: center;
  background-color: #fafafa;
  color: #333;
  box-sizing: border-box;
  cursor: pointer;
}

.upload-zone.dragover {
  background-color: #eef6ff;
  border-color: #005fb8;
}

.upload-zone strong {
  font-size: 20px;
  color: #005fb8;
}

.upload-status {
  margin-top: 10px;
  font-size: 14px;
  font-weight: bold;
}

.hint {
  margin-top: 15px;
  color: #666;
  font-size: 14px;
}

#startButton {
  margin-top: 20px;
  padding: 10px 20px;
  font-size: 16px;
  background-color: #005fb8;
  color: white;
  border: none;
  border-radius: 6px;
  cursor: pointer;
}

#startButton:hover {
  background-color: #004080;
}

.mindmap {
  margin-top: 30px;
  width: 100%;
}

pre {
  background: #f5f5f5;
  padding: 10px;
  margin-top: 20px;
  overflow-x: auto;
  border-radius: 6px;
}
</style>
</head>

<body>

<h1 style="text-align:center;">Finanzanalyse</h1>
<p style="text-align:center; color:#8aaac8; margin-top:-10px; font-size:15px;">Analysiert die liquiden Mittel und überprüft Unternehmen auf Kredittauglichkeit</p>

<div class="upload-grid">
  <div>
    <label style="display:block; font-weight:bold; margin-bottom:8px;">📊 Bilanz</label>
    <div class="upload-zone" id="dropzone-bilanz">
      <p>Drag &amp; Drop oder</p>
      <input type="file" id="csvBilanz" accept=".csv" multiple>
      <div class="upload-status" id="status-bilanz"></div>
    </div>
  </div>
  <div>
    <label style="display:block; font-weight:bold; margin-bottom:8px;">📈 GuV</label>
    <div class="upload-zone" id="dropzone-guv">
      <p>Drag &amp; Drop oder</p>
      <input type="file" id="csvGuV" accept=".csv" multiple>
      <div class="upload-status" id="status-guv"></div>
    </div>
  </div>
</div>

<div id="data-bilanz" style="display:none"></div>
<div id="data-guv" style="display:none"></div>

<button id="startButton">Finanzanalyse starten</button>



<h3>Upload-Protokoll:</h3>
<pre id="upload-log"></pre>

<h3>Analyseergebnis:</h3>
<pre id="output"></pre>

<script>
const uploadLog = document.getElementById("upload-log");

function logMessage(text) {
  uploadLog.textContent += text + "\n";
}

function setupDropzone(zoneId, inputId, statusId, dataId) {
  const zone   = document.getElementById(zoneId);
  const input  = document.getElementById(inputId);
  const status = document.getElementById(statusId);
  const dataDiv = document.getElementById(dataId);

  async function handleFiles(files) {
    let combined = "";
    let names = [];

    for (const file of files) {
      if (!file.name.toLowerCase().endsWith(".csv")) {
        alert(file.name + " ist keine CSV-Datei.");
        continue;
      }
      const text = await file.text();
      // Bei mehreren Dateien: Kopfzeile nur beim ersten Mal übernehmen
      if (combined === "") {
        combined = text;
      } else {
        const zeilen = text.split("\n");
        combined += "\n" + zeilen.slice(1).join("\n");
      }
      names.push(file.name);
      logMessage("Datei hochgeladen: " + file.name);
    }

    if (names.length > 0) {
      dataDiv.textContent = combined;
      status.textContent = "✅ " + names.join(", ");
    }
  }

  input.addEventListener("change", e => {
    if (e.target.files.length > 0) handleFiles(e.target.files);
  });
  zone.addEventListener("dragover", e => { e.preventDefault(); zone.classList.add("dragover"); });
  zone.addEventListener("dragleave", () => zone.classList.remove("dragover"));
  zone.addEventListener("drop", e => {
    e.preventDefault();
    zone.classList.remove("dragover");
    handleFiles(e.dataTransfer.files);
  });
}

setupDropzone("dropzone-bilanz", "csvBilanz", "status-bilanz", "data-bilanz");
setupDropzone("dropzone-guv",    "csvGuV",    "status-guv",    "data-guv");
</script>

<script type="py" src="app.py"></script>

</body>

</html>
