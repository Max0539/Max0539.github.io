<body>

<div id="dropzone">
  <strong>&#128194; Finanzdaten hochladen</strong>

    CSV-Dateien per Drag &amp; Drop hier ablegen oder über den Upload-Button auswählen.
  </div>
</div>

<button id="startButton">Finanzanalyse starten</button>

<svg class="mindmap" viewBox="0 0 900 540" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">

  <line x1="450" y1="270" x2="334" y2="428" stroke="#4a90e2" stroke-width="2"/>
  <line x1="450" y1="270" x2="262" y2="208" stroke="#4a90e2" stroke-width="2"/>

  <circle cx="450" cy="70" r="48" fill="#4a90e2"/>

  <circle cx="650" cy="200" r="55" fill="#4a90e2"/>
  <text x="650" y="195" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="white">Anlage-</text>
  <text x="650" y="212" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="white">verm&#246;gen</text>

  <text x="570" y="440" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="white">Umlauf-</text>

  <!-- Mittelblase (zuletzt = obendrauf) -->
  <circle cx="450" cy="270" r="72" fill="#005fb8"/>
  <text x="450" y="274" text-anchor="middle" dominant-baseline="middle" font-size="15" font-weight="bold" fill="white">Finanzanalyse</text>
</svg>

<h3>Geladene Datei:</h3>
<pre id="output"></pre>

<script>
const dropzone = document.getElementById("dropzone");
const fileInput = document.getElementById("csvFile");
const output = document.getElementById("output");

let aktuelleDatei = null;

async function readFile(file) {
  aktuelleDatei = file;
  const text = await file.text();
  output.textContent = "Datei: " + file.name + "\n\n" + text.substring(0, 1000);
}

fileInput.addEventListener("change", e => {
  if (e.target.files.length > 0) readFile(e.target.files[0]);
});

dropzone.addEventListener("dragover", e => {
  e.preventDefault();
  dropzone.classList.add("dragover");
});

dropzone.addEventListener("dragleave", () => {
  dropzone.classList.remove("dragover");
});

dropzone.addEventListener("drop", e => {
  e.preventDefault();
  dropzone.classList.remove("dragover");
  const file = e.dataTransfer.files[0];
  if (file && file.name.toLowerCase().endsWith(".csv")) {
    readFile(file);
  } else {
    alert("Bitte eine CSV-Datei auswählen.");
  }
});

</script>

<script type="py">
from pyscript import document

def analyse_starten(event):
    print("Finanzanalyse wird gestartet...")

button = document.getElementById("startButton")
button.addEventListener("click", analyse_starten)
</script>

</body>
