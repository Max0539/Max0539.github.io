<!DOCTYPE html>
<html>

<head>
<title>Finanzanalyse</title>

<link rel="stylesheet" href="https://pyscript.net/releases/2025.5.1/core.css">
<link rel="stylesheet" href="index.css">
<script type="module" src="https://pyscript.net/releases/2025.5.1/core.js"></script>

<style>
body {
  font-family: Arial, sans-serif;
  margin: 30px auto;
  max-width: 900px;
  color: #e8eef6;
}

.upload-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 20px;
  margin-top: 20px;
}

.upload-zone {
  min-height: 180px;
  border: 3px dashed #4a90e2;
  border-radius: 12px;
  padding: 20px;
  text-align: center;
  background-color: #fafafa;
  color: #333;
  box-sizing: border-box;
  cursor: pointer;
}

.upload-zone.dragover {
  background-color: #eef6ff;
  border-color: #005fb8;
}

.upload-zone strong {
  font-size: 20px;
  color: #005fb8;
}

.upload-status {
  margin-top: 10px;
  font-size: 14px;
  font-weight: bold;
}

.hint {
  margin-top: 15px;
  color: #666;
  font-size: 14px;
}

#startButton {
  margin-top: 20px;
  padding: 10px 20px;
  font-size: 16px;
  background-color: #005fb8;
  color: white;
  border: none;
  border-radius: 6px;
  cursor: pointer;
}

#startButton:hover {
  background-color: #004080;
}

.mindmap {
  margin-top: 30px;
  width: 100%;
}

pre {
  background: #f5f5f5;
  padding: 10px;
  margin-top: 20px;
  overflow-x: auto;
  border-radius: 6px;
}
</style>
</head>

<body>

<h1 style="text-align:center;">Finanzanalyse</h1>
<p style="text-align:center; color:#8aaac8; margin-top:-10px; font-size:15px;">Analysiert die liquiden Mittel und überprüft Unternehmen auf Kredittauglichkeit</p>

<div class="upload-grid">
  <div>
    <label style="display:block; font-weight:bold; margin-bottom:8px;">📊 Bilanz</label>
    <div class="upload-zone" id="dropzone-bilanz">
      <p>Drag &amp; Drop oder</p>
      <input type="file" id="csvBilanz" accept=".csv">
      <div class="upload-status" id="status-bilanz"></div>
    </div>
  </div>
  <div>
    <label style="display:block; font-weight:bold; margin-bottom:8px;">📈 GuV</label>
    <div class="upload-zone" id="dropzone-guv">
      <p>Drag &amp; Drop oder</p>
      <input type="file" id="csvGuV" accept=".csv">
      <div class="upload-status" id="status-guv"></div>
    </div>
  </div>
</div>

<div id="data-bilanz" style="display:none"></div>
<div id="data-guv" style="display:none"></div>

<button id="startButton">Finanzanalyse starten</button>



<h3>Geladene Datei:</h3>
<pre id="output"></pre>

<script>
function setupDropzone(zoneId, inputId, statusId, dataId) {
  const zone = document.getElementById(zoneId);
  const input = document.getElementById(inputId);
  const status = document.getElementById(statusId);
  const dataDiv = document.getElementById(dataId);

  async function handleFile(file) {
    if (!file || !file.name.toLowerCase().endsWith(".csv")) {
      alert("Bitte eine CSV-Datei auswählen.");
      return;
    }
    const text = await file.text();
    dataDiv.textContent = text;
    status.textContent = "✅ " + file.name;
  }

  input.addEventListener("change", e => {
    if (e.target.files.length > 0) handleFile(e.target.files[0]);
  });
  zone.addEventListener("dragover", e => { e.preventDefault(); zone.classList.add("dragover"); });
  zone.addEventListener("dragleave", () => zone.classList.remove("dragover"));
  zone.addEventListener("drop", e => {
    e.preventDefault();
    zone.classList.remove("dragover");
    handleFile(e.dataTransfer.files[0]);
  });
}

setupDropzone("dropzone-bilanz", "csvBilanz", "status-bilanz", "data-bilanz");
setupDropzone("dropzone-guv",    "csvGuV",    "status-guv",    "data-guv");
</script>

<script type="py">
from pyscript import document
import pandas as pd
import io
from datetime import datetime

AKTUELLES_JAHR = datetime.now().year

def analyse_starten(event):
    bilanz_text = document.getElementById("data-bilanz").textContent
    guv_text    = document.getElementById("data-guv").textContent
    output      = document.getElementById("output")

    if not bilanz_text.strip() or not guv_text.strip():
        output.textContent = "Bitte beide Dateien (Bilanz und GuV) hochladen."
        return

    bilanz = pd.read_csv(io.StringIO(bilanz_text), sep=";")
    guv    = pd.read_csv(io.StringIO(guv_text),    sep=";")

    if "Geschäftsjahr" in bilanz.columns:
        bilanz = bilanz[bilanz["Geschäftsjahr"].astype(str).str.contains(str(AKTUELLES_JAHR))]

    if "Geschäftsjahr" in guv.columns:
        guv = guv[guv["Geschäftsjahr"].astype(str).str.contains(str(AKTUELLES_JAHR))]

    output.textContent = (
        f"=== Bilanz {AKTUELLES_JAHR} ===\n{bilanz.to_string(index=False)}"
        f"\n\n=== GuV {AKTUELLES_JAHR} ===\n{guv.to_string(index=False)}"
    )

document.getElementById("startButton").addEventListener("click", analyse_starten)
</script>

</body>

</html>
