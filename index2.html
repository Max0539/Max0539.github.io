<!DOCTYPE html>
<html>
<head>
  <title>Finanzanalyse – Ergebnis</title>
  <link rel="stylesheet" href="index.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2"></script>
  <style>
    #charts-container {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 24px;
      align-items: start;
    }

    .result-card {
      background: #162433;
      border: 1px solid #2b4157;
      border-radius: 10px;
      padding: 16px;
    }

    .report-card {
      margin-bottom: 22px;
    }

    .report-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px 24px;
      margin-top: 10px;
    }

    .report-line {
      margin: 0;
      font-size: 16px;
      line-height: 1.35;
    }

    .trend-card {
      margin-top: 24px;
    }

    .trend-chart-wrap {
      position: relative;
      height: 420px;
    }

    @media (max-width: 980px) {
      #charts-container {
        grid-template-columns: 1fr;
      }

      .report-grid {
        grid-template-columns: 1fr;
      }

      .trend-chart-wrap {
        height: 320px;
      }
    }
  </style>
</head>
<body>
  <h1 style="text-align:center; font-family:Arial,sans-serif; color:#e8eef6;">Analyseergebnis</h1>

  <div style="font-family:Arial,sans-serif; color:#e8eef6; max-width:1300px; margin:30px auto; padding:0 12px;">
    <div id="charts-container"></div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    let ergebnisse = [];
    const branche = (params.get("branche") || "").trim().toLowerCase();

    const BRANCHEN_PROFIL = {
      tech: { cagrGewicht: 0.8, stabilGewicht: 0.2 },
      mittelstand: { cagrGewicht: 0.7, stabilGewicht: 0.3 },
      industrie: { cagrGewicht: 0.65, stabilGewicht: 0.35 },
      immobilien: { cagrGewicht: 0.6, stabilGewicht: 0.4 },
      banken: { cagrGewicht: 0.6, stabilGewicht: 0.4 },
      default: { cagrGewicht: 0.7, stabilGewicht: 0.3 }
    };

    function formatEuro(zahl) {
      const wert = Number(zahl || 0);
      return new Intl.NumberFormat("de-DE", {
        minimumFractionDigits: 2,
        maximumFractionDigits: 2
      }).format(wert) + " EUR";
    }

    function formatWert(name, wert) {
      if (name === "Jahresüberschuss" && typeof wert === "string") {
        return wert;
      }
      return formatEuro(wert);
    }

    const rawResults = params.get("results");
    if (rawResults) {
      try {
        ergebnisse = JSON.parse(rawResults);
      } catch (e) {
        ergebnisse = [];
      }
    }

    // Fallback für ältere Links mit Einzelwerten
    if (!ergebnisse.length) {
      const msg = params.get("eq_msg") || "Keine Daten gefunden.";
      const ek = parseFloat(params.get("ek") || "0");
      const bs = parseFloat(params.get("bs") || "0");
      ergebnisse = [{ gj: "", msg, ek, bs }];
    }

    const container = document.getElementById("charts-container");

    function parseJahrWert(jahrText) {
      const jahr = Number(String(jahrText || "").trim());
      return Number.isFinite(jahr) ? jahr : null;
    }

    function cagrPunkte(cagrProzent, brancheWert) {
      if (brancheWert === "tech") {
        if (cagrProzent < 2.5) return 0;
        if (cagrProzent < 6.3) return 1;
        if (cagrProzent < 7.2) return 2;
        if (cagrProzent < 7.8) return 3;
        if (cagrProzent < 8.7) return 4;
        if (cagrProzent < 9.2) return 5;
        if (cagrProzent < 10.4) return 6;
        if (cagrProzent < 13.3) return 7;
        if (cagrProzent < 14.6) return 8;
        if (cagrProzent <= 15) return 9;
        return 10;
      }

      if (brancheWert === "banken") {
        if (cagrProzent < 1.4) return 0;
        if (cagrProzent < 4.9) return 1;
        if (cagrProzent < 5.9) return 2;
        if (cagrProzent < 6.6) return 3;
        if (cagrProzent < 8.1) return 4;
        if (cagrProzent < 8.7) return 5;
        if (cagrProzent < 10.4) return 6;
        if (cagrProzent < 12.0) return 7;
        if (cagrProzent < 13.6) return 8;
        if (cagrProzent <= 14.0) return 9;
        return 10;
      }

      if (brancheWert === "immobilien") {
        if (cagrProzent < -19.5) return 0;
        if (cagrProzent < -15.5) return 1;
        if (cagrProzent < -11.0) return 2;
        if (cagrProzent < -3.6) return 3;
        if (cagrProzent < 3.2) return 4;
        if (cagrProzent < 5.8) return 5;
        if (cagrProzent < 6.5) return 6;
        if (cagrProzent < 7.6) return 7;
        if (cagrProzent < 9.8) return 8;
        if (cagrProzent <= 10.0) return 9;
        return 10;
      }

      if (brancheWert === "industrie") {
        if (cagrProzent < -6.1) return 0;
        if (cagrProzent < -3.1) return 1;
        if (cagrProzent < 1.1) return 2;
        if (cagrProzent < 3.5) return 3;
        if (cagrProzent < 4.1) return 4;
        if (cagrProzent < 4.7) return 5;
        if (cagrProzent < 5.4) return 6;
        if (cagrProzent < 6.3) return 7;
        if (cagrProzent < 9.7) return 8;
        if (cagrProzent <= 10.0) return 9;
        return 10;
      }

      if (cagrProzent < -6.1) return 0;
      if (cagrProzent < -3.1) return 1;
      if (cagrProzent < 1.1) return 2;
      if (cagrProzent < 3.5) return 3;
      if (cagrProzent < 4.1) return 4;
      if (cagrProzent < 4.7) return 5;
      if (cagrProzent < 5.4) return 6;
      if (cagrProzent < 6.3) return 7;
      if (cagrProzent < 9.7) return 8;
      if (cagrProzent <= 10.0) return 9;
      return 10;
    }

    function standardabweichung(arr) {
      if (!arr.length) return 0;
      const mittelwert = arr.reduce((sum, x) => sum + x, 0) / arr.length;
      const varianz = arr.reduce((sum, x) => sum + ((x - mittelwert) ** 2), 0) / arr.length;
      return Math.sqrt(varianz);
    }

    function stabilitaetPunkte(stabilWerte) {
      const sd = standardabweichung(stabilWerte);
      if (sd < 1.5) return { punkte: 10, sd };
      if (sd < 3) return { punkte: 8, sd };
      if (sd < 5) return { punkte: 6, sd };
      if (sd < 7) return { punkte: 4, sd };
      if (sd < 10) return { punkte: 2, sd };
      return { punkte: 0, sd };
    }

    function baueAnalyseBericht(daten) {
      if (daten.length < 2) {
        return;
      }

      const profil = BRANCHEN_PROFIL[branche] || BRANCHEN_PROFIL.default;
      const erstes = daten[0];
      const letztes = daten[daten.length - 1];
      const startUmsatz = erstes.umsatz;
      const endUmsatz = letztes.umsatz;
      const n = daten.length;

      let cagr = 0;
      let cagrBerechenbar = false;
      if (startUmsatz > 0 && n > 0) {
        cagr = (endUmsatz / startUmsatz) ** (1 / n) - 1;
        cagrBerechenbar = Number.isFinite(cagr);
      }

      const wachstum = daten
        .map((eintrag, index, arr) => {
          if (index === 0) return null;
          const vorher = arr[index - 1].umsatz;
          if (vorher <= 0) return null;
          return ((eintrag.umsatz - vorher) / vorher) * 100;
        })
        .filter((w) => w !== null);

      const cagrProzent = cagrBerechenbar ? cagr * 100 : 0;
      const punkteCagr = cagrBerechenbar ? cagrPunkte(cagrProzent, branche) : 0;
      const stabil = stabilitaetPunkte(wachstum);
      const punkteGesamt = (punkteCagr * profil.cagrGewicht) + (stabil.punkte * profil.stabilGewicht);

      const report = document.createElement("div");
      report.className = "result-card report-card";

      const titel = document.createElement("h2");
      titel.style.marginTop = "0";
      titel.style.marginBottom = "8px";
      titel.style.textAlign = "left";
      titel.textContent = "Analyse Bericht";

      const grid = document.createElement("div");
      grid.className = "report-grid";
      grid.style.gridTemplateColumns = "1fr";

      const zeilen = [
        `CAGR Ergebnis: ${cagrBerechenbar ? cagrProzent.toFixed(2) + "%" : "nicht berechenbar"}`,
        `Umsatzstabilität: ${stabil.sd.toFixed(2)}%`,
        `Gesamtpunkte (gewichtet): ${punkteGesamt.toFixed(2)} / 10`,
      ];

      zeilen.forEach((text) => {
        const p = document.createElement("p");
        p.className = "report-line";
        p.textContent = text;
        grid.appendChild(p);
      });

      report.appendChild(titel);
      report.appendChild(grid);

      container.parentElement.insertBefore(report, container);
    }

    ergebnisse.forEach((eintrag, index) => {
      const ek = Number(eintrag.ek || 0);
      const bs = Number(eintrag.bs || 0);
      const restAktiva = Math.max(bs - ek, 0);
      const overview = eintrag.overview || {};
      const fremdkapital = Number(overview["Fremdkapital"] ?? overview["Freumdkapital"] ?? 0);

      let verschuldungsgradText = "Der Verschuldungsgrad beträgt nicht berechenbar";
      if (ek > 0) {
        const verschuldungsgrad = (fremdkapital / ek) * 100;
        verschuldungsgradText = `Der Verschuldungsgrad beträgt ${verschuldungsgrad.toFixed(2)}%`;
      }

      const block = document.createElement("div");
      block.className = "result-card";

      const titel = document.createElement("h2");
      titel.style.textAlign = "center";
      titel.style.fontSize = "20px";
      titel.style.marginBottom = "10px";
      titel.textContent = eintrag.gj ? `GJ ${eintrag.gj}` : "Ergebnis";

      const text = document.createElement("p");
      text.style.fontSize = "18px";
      text.style.marginBottom = "20px";
      text.textContent = eintrag.msg || "Keine Daten gefunden.";

      const canvas = document.createElement("canvas");
      canvas.id = `eq-chart-${index}`;
      canvas.width = 400;
      canvas.height = 400;
      canvas.style.maxWidth = "400px";
      canvas.style.display = "block";
      canvas.style.margin = "0 auto";

      const verschuldungsgradP = document.createElement("p");
      verschuldungsgradP.style.textAlign = "center";
      verschuldungsgradP.style.fontSize = "17px";
      verschuldungsgradP.style.marginTop = "12px";
      verschuldungsgradP.style.marginBottom = "12px";
      verschuldungsgradP.textContent = verschuldungsgradText;

      block.appendChild(titel);
      block.appendChild(text);
      block.appendChild(canvas);
      block.appendChild(verschuldungsgradP);

      const tableTitle = document.createElement("h3");
      tableTitle.style.textAlign = "center";
      tableTitle.style.fontSize = "18px";
      tableTitle.style.marginTop = "25px";
      tableTitle.style.marginBottom = "12px";
      tableTitle.textContent = eintrag.gj ? `Financel Overview ${eintrag.gj}` : "Financel Overview";

      const table = document.createElement("table");
      table.style.width = "100%";
      table.style.maxWidth = "640px";
      table.style.margin = "0 auto";
      table.style.borderCollapse = "collapse";
      table.style.background = "#1f2f40";
      table.style.border = "1px solid #36516b";

      const kopf = document.createElement("tr");
      const kopfLinks = document.createElement("th");
      kopfLinks.textContent = "Kennzahl";
      kopfLinks.style.padding = "10px";
      kopfLinks.style.textAlign = "left";
      kopfLinks.style.borderBottom = "1px solid #36516b";

      const kopfRechts = document.createElement("th");
      kopfRechts.textContent = "Wert";
      kopfRechts.style.padding = "10px";
      kopfRechts.style.textAlign = "right";
      kopfRechts.style.borderBottom = "1px solid #36516b";

      kopf.appendChild(kopfLinks);
      kopf.appendChild(kopfRechts);
      table.appendChild(kopf);

      const zeilen = [
        ["Gesamtumsatz", overview["Gesamtumsatz"]],
        ["EBITA", overview["EBITA"]],
        ["Jahresüberschuss", overview["Jahresüberschuss"]],
        ["Bilanzsumme", overview["Bilanzsumme"]],
        ["Eigenkapital", overview["Eigenkapital"]],
        ["Fremdkapital", overview["Fremdkapital"] ?? overview["Freumdkapital"]],
        ["Cash", overview["Cash"]],
      ];

      zeilen.forEach((eintragZeile) => {
        const tr = document.createElement("tr");

        const tdName = document.createElement("td");
        tdName.textContent = eintragZeile[0];
        tdName.style.padding = "10px";
        tdName.style.borderBottom = "1px solid #2b4157";

        const tdWert = document.createElement("td");
        tdWert.textContent = formatWert(eintragZeile[0], eintragZeile[1]);
        tdWert.style.padding = "10px";
        tdWert.style.textAlign = "right";
        tdWert.style.borderBottom = "1px solid #2b4157";

        tr.appendChild(tdName);
        tr.appendChild(tdWert);
        table.appendChild(tr);
      });

      block.appendChild(tableTitle);
      block.appendChild(table);
      container.appendChild(block);

      if (!(ek > 0 || bs > 0)) {
        return;
      }

      new Chart(canvas, {
        type: "pie",
        plugins: [ChartDataLabels],
        data: {
          labels: ["Eigenkapital", "Restliche Aktiva"],
          datasets: [{
            data: [ek, restAktiva],
            backgroundColor: ["#4a90e2", "#e25c4a"],
            borderColor: ["#1a2a3a", "#1a2a3a"],
            borderWidth: 2
          }]
        },
        options: {
          plugins: {
            legend: { labels: { color: "#e8eef6", font: { size: 14 } } },
            datalabels: {
              color: "#ffffff",
              font: { size: 14, weight: "bold" },
              formatter: (value, ctx) => {
                const total = ctx.chart.data.datasets[0].data.reduce((a, b) => a + b, 0);
                if (total === 0) {
                  return "0.0%";
                }
                return (value / total * 100).toFixed(1) + "%";
              }
            }
          }
        }
      });
    });

    const trendDaten = ergebnisse
      .map((eintrag) => {
        const overview = eintrag.overview || {};
        return {
          gj: String(eintrag.gj || "").trim(),
          umsatz: Number(overview["Gesamtumsatz"] || 0),
          eigenkapital: Number(overview["Eigenkapital"] ?? eintrag.ek ?? 0)
        };
      })
      .filter((eintrag) => eintrag.gj !== "")
      .sort((a, b) => {
        const aJahr = parseJahrWert(a.gj);
        const bJahr = parseJahrWert(b.gj);

        if (aJahr !== null && bJahr !== null) {
          return aJahr - bJahr;
        }
        return a.gj.localeCompare(b.gj, "de");
      });

    baueAnalyseBericht(trendDaten);

    if (trendDaten.length > 0) {
      const jahre = trendDaten.map((eintrag) => eintrag.gj);
      const eigenkapitalWerte = trendDaten.map((eintrag) => eintrag.eigenkapital);

      const umsatzwachstumWerte = trendDaten.map((eintrag, index, arr) => {
        if (index === 0) {
          return null;
        }

        const vorher = arr[index - 1].umsatz;
        if (vorher <= 0) {
          return null;
        }

        return ((eintrag.umsatz - vorher) / vorher) * 100;
      });

      const trendCard = document.createElement("div");
      trendCard.className = "result-card trend-card";

      const trendTitle = document.createElement("h2");
      trendTitle.style.textAlign = "center";
      trendTitle.style.fontSize = "20px";
      trendTitle.style.marginBottom = "14px";
      trendTitle.textContent = "Umsatzwachstum und Eigenkapitalentwicklung";

      const trendWrap = document.createElement("div");
      trendWrap.className = "trend-chart-wrap";

      const trendCanvas = document.createElement("canvas");
      trendCanvas.id = "trend-chart";

      trendWrap.appendChild(trendCanvas);
      trendCard.appendChild(trendTitle);
      trendCard.appendChild(trendWrap);
      container.parentElement.appendChild(trendCard);

      new Chart(trendCanvas, {
        type: "line",
        data: {
          labels: jahre,
          datasets: [
            {
              label: "Umsatzwachstum (%)",
              data: umsatzwachstumWerte,
              yAxisID: "yPercent",
              borderColor: "#4a90e2",
              backgroundColor: "rgba(74, 144, 226, 0.2)",
              borderWidth: 3,
              tension: 0.3,
              pointRadius: 4,
              pointHoverRadius: 6,
              spanGaps: true
            },
            {
              label: "Eigenkapital (EUR)",
              data: eigenkapitalWerte,
              yAxisID: "yEuro",
              borderColor: "#5dbf8a",
              backgroundColor: "rgba(93, 191, 138, 0.2)",
              borderWidth: 3,
              tension: 0.3,
              pointRadius: 4,
              pointHoverRadius: 6
            }
          ]
        },
        options: {
          maintainAspectRatio: false,
          interaction: {
            mode: "index",
            intersect: false
          },
          plugins: {
            legend: {
              labels: {
                color: "#e8eef6",
                font: { size: 13 }
              }
            },
            datalabels: {
              display: false
            },
            tooltip: {
              callbacks: {
                label: (ctx) => {
                  const label = ctx.dataset.label || "";
                  const value = ctx.parsed.y;

                  if (ctx.dataset.yAxisID === "yPercent") {
                    if (value === null || Number.isNaN(value)) {
                      return `${label}: keine Basis`;
                    }
                    return `${label}: ${value.toFixed(2)}%`;
                  }

                  return `${label}: ${formatEuro(value)}`;
                }
              }
            }
          },
          scales: {
            x: {
              ticks: { color: "#c8ddf5" },
              grid: { color: "rgba(200, 221, 245, 0.12)" }
            },
            yPercent: {
              type: "linear",
              position: "left",
              ticks: {
                color: "#4a90e2",
                callback: (value) => `${value}%`
              },
              grid: { color: "rgba(200, 221, 245, 0.12)" }
            },
            yEuro: {
              type: "linear",
              position: "right",
              ticks: {
                color: "#5dbf8a",
                callback: (value) => formatEuro(value)
              },
              grid: {
                drawOnChartArea: false
              }
            }
          }
        }
      });
    }
  </script>
</body>
</html>
