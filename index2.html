<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Finanzanalyse – Ergebnis</title>
  <link rel="stylesheet" href="index.css?v=46">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2"></script>
  <style>
    #charts-container {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 24px;
      align-items: start;
    }

    .result-card {
      background: #162433;
      border: 1px solid #2b4157;
      border-radius: 10px;
      padding: 16px;
    }

    .report-card {
      margin-bottom: 22px;
    }

    .report-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px 24px;
      margin-top: 10px;
    }

    .report-line {
      margin: 0;
      font-size: 16px;
      line-height: 1.35;
    }

    .trend-card {
      margin-top: 24px;
    }

    .trend-chart-wrap {
      position: relative;
      height: 420px;
    }

    .kennzahlen-card {
      margin-top: 24px;
    }

    .kennzahlen-legende {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 16px;
      margin: 0 0 14px 0;
      font-size: 13px;
      color: #b0c4de;
    }

    .kennzahlen-legende span::before {
      content: "";
      display: inline-block;
      width: 12px;
      height: 12px;
      border-radius: 3px;
      margin-right: 6px;
      vertical-align: -1px;
      background: var(--farbe);
    }

    .kennzahlen-scroll {
      overflow-x: auto;
    }

    .kennzahlen-tabelle {
      width: 100%;
      border-collapse: collapse;
      background: #1f2f40;
      border: 1px solid #36516b;
      font-size: 14px;
    }

    .kennzahlen-tabelle th,
    .kennzahlen-tabelle td {
      padding: 8px 10px;
      border-bottom: 1px solid #2b4157;
      text-align: left;
      vertical-align: top;
    }

    .kennzahlen-tabelle td.wert {
      text-align: right;
      white-space: nowrap;
      font-weight: bold;
      color: #ffffff;
    }

    .kennzahlen-tabelle tr.saeule th {
      background: #24384d;
      color: #c8ddf5;
      font-size: 15px;
    }

    .kennzahlen-tabelle .formel {
      display: block;
      font-size: 12px;
      color: #8aaac8;
      margin-top: 2px;
    }

    .kennzahlen-tabelle .ziel {
      font-size: 12px;
      color: #b0c4de;
      white-space: nowrap;
    }

    .kennzahlen-tabelle th.rechts { text-align: right; }

    .kennzahlen-tabelle td.vergleich {
      text-align: right;
      white-space: nowrap;
      font-size: 13px;
      color: #b0c4de;
    }

    .kennzahlen-tabelle td.vergleich.besser { color: #6fd39a; }
    .kennzahlen-tabelle td.vergleich.schlechter { color: #f08a8a; }

    .kennzahlen-tabelle tr.gesamt td {
      font-weight: bold;
      font-size: 15px;
      border-top: 2px solid #4a90e2;
    }

    .kennzahlen-tabelle .bedeutung {
      display: inline-block;
      margin-left: 8px;
      padding: 1px 6px;
      border-radius: 8px;
      font-size: 11px;
      background: #2f4a66;
      color: #c8ddf5;
    }

    .kennzahlen-tabelle .bedeutung-kern { background: #005fb8; color: #ffffff; }

    .score-card {
      margin-bottom: 22px;
    }

    .kennzahlen-card details summary {
      cursor: pointer;
      color: #c8ddf5;
      margin-bottom: 10px;
    }

    .ampel-gruen { background: #2e7d4f; }
    .ampel-gelb { background: #a88400; }
    .ampel-orange { background: #c2651a; }
    .ampel-rot { background: #a83838; }
    .ampel-info { background: #2f4a66; }
    .ampel-na { background: #3a4a5a; color: #b0c4de !important; font-weight: normal !important; }

    @media (max-width: 980px) {
      #charts-container {
        grid-template-columns: 1fr;
      }

      .report-grid {
        grid-template-columns: 1fr;
      }

      .trend-chart-wrap {
        height: 320px;
      }
    }
  </style>
</head>
<body>
  <h1 style="text-align:center; font-family:Arial,sans-serif; color:#e8eef6;">Analyseergebnis</h1>

  <div style="font-family:Arial,sans-serif; color:#e8eef6; max-width:1300px; margin:30px auto; padding:0 12px;">
    <div id="charts-container"></div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    let ergebnisse = [];
    const branche = (params.get("branche") || "").trim().toLowerCase();

    const BRANCHEN_PROFIL = {
      tech: { cagrGewicht: 0.8, stabilGewicht: 0.2 },
      mittelstand: { cagrGewicht: 0.7, stabilGewicht: 0.3 },
      industrie: { cagrGewicht: 0.65, stabilGewicht: 0.35 },
      immobilien: { cagrGewicht: 0.6, stabilGewicht: 0.4 },
      banken: { cagrGewicht: 0.6, stabilGewicht: 0.4 },
      default: { cagrGewicht: 0.7, stabilGewicht: 0.3 }
    };

    function formatEuro(zahl) {
      const wert = Number(zahl || 0);
      return new Intl.NumberFormat("de-DE", {
        minimumFractionDigits: 2,
        maximumFractionDigits: 2
      }).format(wert) + " EUR";
    }

    function formatWert(name, wert) {
      if (name === "Jahresüberschuss" && typeof wert === "string") {
        return wert;
      }
      return formatEuro(wert);
    }

    // ============================================================
    // Liste aller Kennzahlen (aus Kennzahlen_Bonitaetspruefung.xlsx, Blatt „Kennzahlen“)
    // ============================================================
    // id        = Kürzel, gleich wie in app.py (z. B. "K01")
    // richtung  = "hoeher" (höher ist besser), "niedriger" (niedriger ist besser) oder "info" (keine Ampel)
    // schwellen = [Grenze Grün, Grenze Gelb, Grenze Orange]; schlechter als Orange = Rot
    // trend     = true -> Vergleich mit dem Vorjahr anzeigen
    const KENNZAHLEN_META = [
      {"id": "K01", "saeule": "Kapitalstruktur", "name": "Eigenkapitalquote", "formel": "Eigenkapital / Bilanzsumme", "einheit": "%", "richtung": "hoeher", "schwellen": [0.3, 0.2, 0.1], "bedeutung": "Kern", "trend": true, "hinweis": "Zentrale Kennzahl im Bankrating. Stark branchenabhängig (Handel/Bau niedriger, Industrie höher). Bilanzsumme ggf. bereinigen (z. B. erhaltene Anzahlungen, Gesellschafterdarlehen)."},
      {"id": "K02", "saeule": "Kapitalstruktur", "name": "Fremdkapitalquote", "formel": "Fremdkapital / Bilanzsumme", "einheit": "%", "richtung": "niedriger", "schwellen": [0.7, 0.8, 0.9], "bedeutung": "Wichtig", "trend": false, "hinweis": "Gegenstück zur Eigenkapitalquote (zusammen 100 %)."},
      {"id": "K03", "saeule": "Kapitalstruktur", "name": "Verschuldungsgrad", "formel": "Fremdkapital / Eigenkapital", "einheit": "%", "richtung": "niedriger", "schwellen": [1.5, 2, 4], "bedeutung": "Kern", "trend": true, "hinweis": "Banken erwarten laut Quellen max. ca. 200 % (Faktor 2). Bei negativem Eigenkapital wird Rot gesetzt."},
      {"id": "K04", "saeule": "Kapitalstruktur", "name": "Anlagenintensität", "formel": "Anlagevermögen / Bilanzsumme", "einheit": "%", "richtung": "niedriger", "schwellen": [0.4, 0.6, 0.8], "bedeutung": "Ergänzend", "trend": false, "hinweis": "Hohe Anlagenintensität gilt für Banken als weniger günstig, da Maschinen/Gebäude in Notzeiten schlechter verwertbar sind. Sehr branchenabhängig."},
      {"id": "K05", "saeule": "Kapitalstruktur", "name": "Anlagendeckung I", "formel": "Eigenkapital / Anlagevermögen", "einheit": "%", "richtung": "hoeher", "schwellen": [1, 0.7, 0.4], "bedeutung": "Wichtig", "trend": false, "hinweis": "Zeigt, ob das Anlagevermögen durch Eigenkapital gedeckt ist."},
      {"id": "K06", "saeule": "Kapitalstruktur", "name": "Anlagendeckung II", "formel": "(Eigenkapital + langfr. Fremdkapital) / Anlagevermögen", "einheit": "%", "richtung": "hoeher", "schwellen": [1.2, 1, 0.8], "bedeutung": "Wichtig", "trend": false, "hinweis": "Goldene Bilanzregel: langfristig gebundenes Vermögen sollte langfristig finanziert sein (mind. 100 %)."},
      {"id": "K07", "saeule": "Kapitalstruktur", "name": "Bankverbindlichkeitenquote", "formel": "Verbindlichkeiten ggü. Banken / Bilanzsumme", "einheit": "%", "richtung": "niedriger", "schwellen": [0.3, 0.45, 0.6], "bedeutung": "Wichtig", "trend": false, "hinweis": "Abhängigkeit von Bankfinanzierung."},
      {"id": "K08", "saeule": "Kapitalstruktur", "name": "Netto-Finanzverbindlichkeitenquote", "formel": "(Finanzverbindlichkeiten – liquide Mittel) / Bilanzsumme", "einheit": "%", "richtung": "niedriger", "schwellen": [0.25, 0.4, 0.55], "bedeutung": "Wichtig", "trend": false, "hinweis": "Wird u. a. im Bundesbank-Verfahren (IFRS) verwendet."},
      {"id": "R01", "saeule": "Rentabilität", "name": "Umsatzrentabilität", "formel": "Ergebnis vor Steuern (EBT) / Gesamtleistung", "einheit": "%", "richtung": "hoeher", "schwellen": [0.05, 0.02, 0], "bedeutung": "Kern", "trend": true, "hinweis": "Ertragskraft je Euro Leistung. Immer mit Branchenwerten vergleichen."},
      {"id": "R02", "saeule": "Rentabilität", "name": "Gesamtkapitalrentabilität", "formel": "(EBT + Zinsaufwand) / Bilanzsumme", "einheit": "%", "richtung": "hoeher", "schwellen": [0.08, 0.04, 0.01], "bedeutung": "Kern", "trend": false, "hinweis": "Verzinsung des gesamten eingesetzten Kapitals."},
      {"id": "R03", "saeule": "Rentabilität", "name": "Eigenkapitalrentabilität", "formel": "EBT / Eigenkapital", "einheit": "%", "richtung": "hoeher", "schwellen": [0.15, 0.08, 0.02], "bedeutung": "Wichtig", "trend": false, "hinweis": "Bei sehr niedrigem EK kann der Wert verzerrt hoch sein. Bei negativem EK wird Rot gesetzt."},
      {"id": "R04", "saeule": "Rentabilität", "name": "EBITDA-Marge", "formel": "EBITDA / Umsatzerlöse (EBITDA = EBT + Zinsaufwand + Abschreibungen)", "einheit": "%", "richtung": "hoeher", "schwellen": [0.12, 0.06, 0.02], "bedeutung": "Wichtig", "trend": true, "hinweis": "Operative Ertragskraft vor Zinsen und Abschreibungen."},
      {"id": "R05", "saeule": "Rentabilität", "name": "Personalaufwandsquote", "formel": "Personalaufwand / Gesamtleistung", "einheit": "%", "richtung": "niedriger", "schwellen": [0.3, 0.45, 0.6], "bedeutung": "Ergänzend", "trend": false, "hinweis": "Kostenstruktur; stark branchenabhängig (Dienstleistung deutlich höher als Handel)."},
      {"id": "R06", "saeule": "Rentabilität", "name": "Materialaufwandsquote", "formel": "Materialaufwand / Gesamtleistung", "einheit": "%", "richtung": "niedriger", "schwellen": [0.4, 0.55, 0.7], "bedeutung": "Ergänzend", "trend": false, "hinweis": "Kostenstruktur; stark branchenabhängig."},
      {"id": "R07", "saeule": "Rentabilität", "name": "Umsatzwachstum", "formel": "Umsatz aktuell / Umsatz Vorjahr – 1", "einheit": "%", "richtung": "hoeher", "schwellen": [0.03, 0, -0.1], "bedeutung": "Ergänzend", "trend": false, "hinweis": "Entwicklung der Gesamtleistung über mehrere Jahre ist ein Standardkriterium. Starkes Wachstum kann zusätzlich Liquiditätsbedarf auslösen."},
      {"id": "C01", "saeule": "Cashflow & Kapitaldienst", "name": "Cashflow (absolut)", "formel": "Jahresüberschuss + Abschreibungen ± Veränderung Rückstellungen", "einheit": "€", "richtung": "info", "schwellen": null, "bedeutung": "Kern", "trend": true, "hinweis": "Basisgröße für fast alle Cashflow-Kennzahlen. Sollte positiv und über die Jahre stabil sein. Kein fester Schwellenwert."},
      {"id": "C02", "saeule": "Cashflow & Kapitaldienst", "name": "Cashflow-Rate", "formel": "Cashflow / Umsatzerlöse", "einheit": "%", "richtung": "hoeher", "schwellen": [0.08, 0.04, 0.01], "bedeutung": "Wichtig", "trend": true, "hinweis": "Liquiditätswirksame Ertragskraft je Euro Umsatz."},
      {"id": "C03", "saeule": "Cashflow & Kapitaldienst", "name": "Schuldentilgungsdauer (dynamischer Verschuldungsgrad)", "formel": "(Verbindlichkeiten – liquide Mittel) / Cashflow", "einheit": "Jahre", "richtung": "niedriger", "schwellen": [3, 5, 10], "bedeutung": "Kern", "trend": true, "hinweis": "Wie viele Jahre würde die rechnerische Entschuldung aus dem Cashflow dauern? Bei Cashflow ≤ 0 wird Rot gesetzt."},
      {"id": "C04", "saeule": "Cashflow & Kapitaldienst", "name": "Zinsdeckung", "formel": "EBIT / Zinsaufwand (EBIT = EBT + Zinsaufwand)", "einheit": "Faktor", "richtung": "hoeher", "schwellen": [5, 3, 1.5], "bedeutung": "Wichtig", "trend": false, "hinweis": "Wie oft werden die Zinsen aus dem operativen Ergebnis verdient? Ratingagenturen nutzen vergleichbar EBITDA/Zinsen."},
      {"id": "C05", "saeule": "Cashflow & Kapitaldienst", "name": "Kapitaldienstgrenze", "formel": "Erweiterter Cashflow – betriebsnotwendige Investitionen (erw. Cashflow = Cashflow + Zinsaufwand – Steuern/Entnahmen/Ausschüttungen)", "einheit": "€", "richtung": "info", "schwellen": null, "bedeutung": "Kern", "trend": false, "hinweis": "Maximale jährliche Kreditbelastung. Muss größer sein als der geplante Kapitaldienst (Zins + Tilgung). Details je Bank unterschiedlich."},
      {"id": "C06", "saeule": "Cashflow & Kapitaldienst", "name": "Auslastung der Kapitaldienstgrenze", "formel": "Kapitaldienst (Zins + Tilgung) / Kapitaldienstgrenze", "einheit": "%", "richtung": "niedriger", "schwellen": [0.7, 0.9, 1], "bedeutung": "Kern", "trend": false, "hinweis": "Je niedriger, desto besser. Über 100 % = Kapitaldienst nicht aus dem Cashflow tragbar. Bei Kapitaldienstgrenze ≤ 0 wird Rot gesetzt."},
      {"id": "C07", "saeule": "Cashflow & Kapitaldienst", "name": "DSCR (Debt Service Coverage Ratio)", "formel": "(Cashflow + Zinsaufwand) / (Zinsaufwand + Tilgung)", "einheit": "Faktor", "richtung": "hoeher", "schwellen": [1.5, 1.25, 1], "bedeutung": "Wichtig", "trend": true, "hinweis": "Internationale Variante der Kapitaldienstfähigkeit. 1,0 = Kapitaldienst gerade gedeckt; 1,25 bis 2,5 wird in Quellen als solide bis sicher genannt."},
      {"id": "L01", "saeule": "Liquidität & Working Capital", "name": "Liquidität 1. Grades (Barliquidität)", "formel": "Liquide Mittel / kurzfr. Verbindlichkeiten", "einheit": "%", "richtung": "hoeher", "schwellen": [0.2, 0.1, 0.05], "bedeutung": "Wichtig", "trend": false, "hinweis": "Sofort verfügbare Zahlungsfähigkeit."},
      {"id": "L02", "saeule": "Liquidität & Working Capital", "name": "Liquidität 2. Grades (Einzugsliquidität)", "formel": "(Liquide Mittel + Forderungen) / kurzfr. Verbindlichkeiten", "einheit": "%", "richtung": "hoeher", "schwellen": [1, 0.8, 0.5], "bedeutung": "Wichtig", "trend": true, "hinweis": "Faustregel: mind. 100 % anstreben."},
      {"id": "L03", "saeule": "Liquidität & Working Capital", "name": "Liquidität 3. Grades (Umlaufdeckung)", "formel": "Umlaufvermögen / kurzfr. Verbindlichkeiten", "einheit": "%", "richtung": "hoeher", "schwellen": [1.5, 1.2, 1], "bedeutung": "Wichtig", "trend": false, "hinweis": "Unter 100 % sind kurzfristige Schulden nicht durch Umlaufvermögen gedeckt."},
      {"id": "L04", "saeule": "Liquidität & Working Capital", "name": "Working Capital (relativ)", "formel": "(Umlaufvermögen – kurzfr. Fremdkapital) / Umsatzerlöse", "einheit": "%", "richtung": "hoeher", "schwellen": [0.1, 0, -0.1], "bedeutung": "Wichtig", "trend": false, "hinweis": "Positives Working Capital = Finanzierungsspielraum. Lexware nennt auch Verhältnis zum Umsatz zur Vergleichbarkeit."},
      {"id": "L05", "saeule": "Liquidität & Working Capital", "name": "Debitorenziel (DSO)", "formel": "Forderungen aus L+L / Umsatzerlöse × 360", "einheit": "Tage", "richtung": "niedriger", "schwellen": [40, 60, 90], "bedeutung": "Wichtig", "trend": true, "hinweis": "Durchschnittliche Zahlungsdauer der Kunden. Längere Zahlungsziele verschlechtern die Kennzahlen."},
      {"id": "L06", "saeule": "Liquidität & Working Capital", "name": "Lagerdauer (DIO)", "formel": "Vorräte / Materialaufwand × 360", "einheit": "Tage", "richtung": "niedriger", "schwellen": [45, 90, 150], "bedeutung": "Wichtig", "trend": true, "hinweis": "Kapitalbindung im Lager. Höherer Warenbestand verschlechtert die Kennzahl."},
      {"id": "L07", "saeule": "Liquidität & Working Capital", "name": "Kreditorenziel (DPO)", "formel": "Verbindlichkeiten aus L+L / Materialaufwand × 360", "einheit": "Tage", "richtung": "info", "schwellen": null, "bedeutung": "Ergänzend", "trend": false, "hinweis": "Nur zur Einordnung. Sehr hohe Werte können auf Zahlungsverzug bei Lieferanten hindeuten, niedrige auf wenig genutzte Lieferantenkredite."},
      {"id": "L08", "saeule": "Liquidität & Working Capital", "name": "Cash Conversion Cycle", "formel": "Debitorenziel + Lagerdauer – Kreditorenziel", "einheit": "Tage", "richtung": "niedriger", "schwellen": [30, 60, 120], "bedeutung": "Ergänzend", "trend": true, "hinweis": "Dauer der Kapitalbindung im operativen Kreislauf."},
    ];

    // Aus Kennzahlen_Bonitaetspruefung.xlsx (Blatt „Weiche Faktoren“)
    const WEICHE_FAKTOREN = [
      {"bereich": "Kontoführung", "kriterium": "Überziehungen", "frage": "Wird das Konto im vereinbarten Rahmen geführt?", "positiv": "Keine ungenehmigten Überziehungen, Limit eingehalten", "negativ": "Wiederholte oder dauerhafte ungenehmigte Überziehungen", "einfluss": "Hoch"},
      {"bereich": "Kontoführung", "kriterium": "Rücklastschriften, Pfändungen", "frage": "Gibt es Rücklastschriften, Mahnungen oder Pfändungen?", "positiv": "Keine", "negativ": "Häufige Rücklastschriften oder Pfändungen", "einfluss": "Hoch"},
      {"bereich": "Kontoführung", "kriterium": "Entwicklung der Kontoumsätze", "frage": "Passen Zahlungseingänge zu den gemeldeten Umsätzen?", "positiv": "Stabile oder wachsende Eingänge, passend zur BWA", "negativ": "Rückläufige Eingänge, Abweichung zu BWA/Steuerdaten", "einfluss": "Mittel"},
      {"bereich": "Kontoführung", "kriterium": "Auslastung des Kontokorrents", "frage": "Wie stark wird die Kreditlinie dauerhaft genutzt?", "positiv": "Linie wird schwankend und mit Spielraum genutzt", "negativ": "Linie dauerhaft ausgeschöpft", "einfluss": "Mittel"},
      {"bereich": "Branche / Markt", "kriterium": "Branchenrisiko", "frage": "Gilt die Branche bei Banken als Risikobranche?", "positiv": "Stabile, wachsende oder krisenfeste Branche", "negativ": "Zyklische oder strukturell schrumpfende Branche", "einfluss": "Hoch"},
      {"bereich": "Branche / Markt", "kriterium": "Marktposition und Wettbewerb", "frage": "Wie stark ist die Wettbewerbsposition?", "positiv": "Klare Positionierung, Alleinstellungsmerkmale", "negativ": "Austauschbares Angebot, Preisdruck", "einfluss": "Mittel"},
      {"bereich": "Geschäftsmodell", "kriterium": "Kundenabhängigkeit", "frage": "Wie hoch ist der Umsatzanteil der größten Kunden?", "positiv": "Breite Kundenbasis, kein Kunde dominiert", "negativ": "Ein Großkunde macht einen sehr hohen Umsatzanteil aus", "einfluss": "Hoch"},
      {"bereich": "Geschäftsmodell", "kriterium": "Lieferantenabhängigkeit", "frage": "Gibt es Klumpenrisiken auf Lieferantenseite?", "positiv": "Mehrere Bezugsquellen", "negativ": "Einzelner Lieferant, schwer ersetzbar", "einfluss": "Mittel"},
      {"bereich": "Geschäftsmodell", "kriterium": "Vertrieb und Marketing", "frage": "Ist die Vertriebsstrategie nachvollziehbar?", "positiv": "Klare Strategie, planbarer Auftragsbestand", "negativ": "Unklare Pipeline, Zufallsumsätze", "einfluss": "Mittel"},
      {"bereich": "Management", "kriterium": "Qualifikation und Erfahrung", "frage": "Verfügt die Führung über Branchen- und Führungserfahrung?", "positiv": "Lange Erfahrung, nachweisbarer Track Record", "negativ": "Neue Führung ohne Erfahrung", "einfluss": "Hoch"},
      {"bereich": "Management", "kriterium": "Nachfolge und Vertretung", "frage": "Ist Nachfolge bzw. Vertretung geregelt?", "positiv": "Geregelte Nachfolge, Know-how dokumentiert", "negativ": "Abhängigkeit von einer Person ohne Vertretung", "einfluss": "Hoch"},

      {"bereich": "Sicherheiten", "kriterium": "Haftungsverbünde und Verflechtungen", "frage": "Bestehen Verflechtungen mit anderen Unternehmen oder Gesellschaftern?", "positiv": "Starke Gesellschafter, werthaltige Gesellschafterbürgschaft", "negativ": "Abhängigkeit von schwachen Konzernunternehmen", "einfluss": "Mittel"},

      {"bereich": "Zusammenarbeit mit der Bank", "kriterium": "Dauer der Bankverbindung", "frage": "Wie lange besteht die Geschäftsbeziehung?", "positiv": "Lange, stabile Bankverbindung", "negativ": "Häufiger Bankwechsel", "einfluss": "Gering"},
      {"bereich": "Negativmerkmale", "kriterium": "Auskunfteien und Zahlungsverhalten", "frage": "Gibt es Negativmerkmale bei Auskunfteien (z. B. Schufa, Creditreform)?", "positiv": "Keine Negativmerkmale, pünktliche Zahlungen", "negativ": "Zahlungsausfälle, Inkasso, Insolvenzantrag, Eidesstattliche Versicherung", "einfluss": "Sehr hoch"},
      {"bereich": "Negativmerkmale", "kriterium": "Steuer- und Sozialabgabenrückstände", "frage": "Bestehen Rückstände bei Finanzamt, Sozialversicherung oder Mieten?", "positiv": "Keine Rückstände", "negativ": "Rückstände, Stundungen, Vollstreckungen", "einfluss": "Hoch"},
      {"bereich": "Nachhaltigkeit (ESG)", "kriterium": "Nachhaltigkeitsrisiken", "frage": "Gibt es branchenspezifische Nachhaltigkeitsrisiken? Banken fragen dies bei größeren Krediten ab.", "positiv": "Geringe Risiken, nachvollziehbare Maßnahmen", "negativ": "Hohe Transitions- oder Umweltrisiken ohne Gegenmaßnahmen", "einfluss": "Gering bis mittel"},
    ];

    // ============================================================
    // Einstellungen für die Bewertung (aus der Excel, Blatt „Rechner“)
    // ============================================================

    // Punkte, die eine Kennzahl je nach Ampelfarbe bekommt
    const PUNKTE_JE_AMPEL = { gruen: 100, gelb: 70, orange: 35, rot: 0 };

    // Gewicht jeder Säule im Gesamtscore (zusammen 100 %)
    const SAEULEN_GEWICHTE = {
      "Kapitalstruktur": 0.25,
      "Rentabilität": 0.2,
      "Cashflow & Kapitaldienst": 0.35,
      "Liquidität & Working Capital": 0.2
    };

    // Ab wie vielen Punkten der Score grün, gelb oder orange ist (darunter rot)
    const SCORE_GRUEN = 75;
    const SCORE_GELB = 55;
    const SCORE_ORANGE = 35;

    // Text und Farbe für jede Ampel
    const AMPEL_TEXT = {
      gruen: "Gut",
      gelb: "Akzeptabel",
      orange: "Kritisch",
      rot: "Schlecht",
      info: "Ohne Bewertung",
      na: "Nicht berechenbar"
    };

    const AMPEL_FARBE = {
      gruen: "#2e7d4f",
      gelb: "#a88400",
      orange: "#c2651a",
      rot: "#a83838",
      info: "#2f4a66",
      na: "#3a4a5a"
    };


    // ============================================================
    // Kleine Hilfsfunktionen
    // ============================================================

    // Prüft, ob ein Wert eine richtige Zahl ist (nicht null, nicht leer)
    function istZahl(wert) {
      return typeof wert === "number" && isFinite(wert);
    }

    // Schreibt eine Zahl auf Deutsch, z. B. zahlDe(1234.5, 1) -> "1.234,5"
    function zahlDe(zahl, nachkommastellen) {
      return zahl.toLocaleString("de-DE", {
        minimumFractionDigits: nachkommastellen,
        maximumFractionDigits: nachkommastellen
      });
    }

    // Erstellt ein HTML-Element mit Text, z. B. neuesElement("td", "Hallo", "wert")
    function neuesElement(tag, text, klasse) {
      const element = document.createElement(tag);
      element.textContent = text;
      if (klasse) {
        element.className = klasse;
      }
      return element;
    }

    // Erstellt eine Karte (Kasten) mit Überschrift
    function neueKarte(ueberschrift, klasse) {
      const karte = document.createElement("div");
      karte.className = "result-card " + klasse;

      const titel = neuesElement("h2", ueberschrift);
      titel.style.textAlign = "center";
      titel.style.fontSize = "20px";
      titel.style.marginBottom = "12px";
      karte.appendChild(titel);
      return karte;
    }

    // Kleiner grauer Erklärungstext unter einer Tabelle
    function neuerHinweis(text) {
      const absatz = neuesElement("p", text);
      absatz.style.fontSize = "12px";
      absatz.style.color = "#8aaac8";
      absatz.style.marginTop = "12px";
      return absatz;
    }

    // Legende mit allen Ampelfarben
    function neueLegende() {
      const legende = document.createElement("div");
      legende.className = "kennzahlen-legende";
      for (const ampel in AMPEL_FARBE) {
        const eintrag = neuesElement("span", AMPEL_TEXT[ampel]);
        eintrag.style.setProperty("--farbe", AMPEL_FARBE[ampel]);
        legende.appendChild(eintrag);
      }
      return legende;
    }


    // ============================================================
    // Kennzahlen anzeigen und bewerten
    // ============================================================

    // Zeigt einen Wert mit Einheit an, z. B. 0.253 -> "25,3 %"
    function formatKennzahl(meta, wert) {
      if (!istZahl(wert)) {
        return "–";
      }
      if (meta.einheit === "%") {
        return zahlDe(wert * 100, 1) + " %";
      }
      if (meta.einheit === "€") {
        return formatEuro(wert);
      }
      if (meta.einheit === "Tage") {
        return zahlDe(wert, 0) + " Tage";
      }
      if (meta.einheit === "Jahre") {
        return zahlDe(wert, 1) + " Jahre";
      }
      if (meta.einheit === "Faktor") {
        return zahlDe(wert, 1) + "x";
      }
      return zahlDe(wert, 2);
    }

    // Gibt die Ampelfarbe einer Kennzahl zurück: "gruen", "gelb", "orange", "rot", "info" oder "na"
    function bewerteKennzahl(meta, ergebnis) {
      if (!ergebnis) {
        return "na";
      }
      // Sonderfall aus app.py, z. B. Eigenkapital ≤ 0 -> immer rot
      if (ergebnis.ampel) {
        return ergebnis.ampel;
      }
      if (!istZahl(ergebnis.wert)) {
        return "na";
      }
      // Kennzahl ohne Schwellenwerte (z. B. Cashflow in Euro)
      if (!meta.schwellen || meta.richtung === "info") {
        return "info";
      }

      const wert = ergebnis.wert;
      const gut = meta.schwellen[0];
      const akzeptabel = meta.schwellen[1];
      const kritisch = meta.schwellen[2];

      if (meta.richtung === "hoeher") {
        // Höher ist besser
        if (wert >= gut) return "gruen";
        if (wert >= akzeptabel) return "gelb";
        if (wert >= kritisch) return "orange";
        return "rot";
      } else {
        // Niedriger ist besser
        if (wert <= gut) return "gruen";
        if (wert <= akzeptabel) return "gelb";
        if (wert <= kritisch) return "orange";
        return "rot";
      }
    }

    // Text für die Spalte "Ziel (Grün)", z. B. "≥ 30,0 %"
    function zielText(meta) {
      if (!meta.schwellen || meta.richtung === "info") {
        return "–";
      }
      let zeichen = "≤";
      if (meta.richtung === "hoeher") {
        zeichen = "≥";
      }
      return zeichen + " " + formatKennzahl(meta, meta.schwellen[0]);
    }

    // Vergleicht eine Kennzahl mit dem Vorjahr.
    // Gibt zurück: { text: "▲ +2,3 %-Pkt.", klasse: "besser" / "schlechter" / "" }
    function vergleichMitVorjahr(meta, aktuell, vorjahr) {
      if (!istZahl(aktuell) || !istZahl(vorjahr)) {
        return { text: "–", klasse: "" };
      }

      let differenz = aktuell - vorjahr;

      // Ganz kleine Unterschiede (die man nach dem Runden nicht sieht) zählen als 0
      let genauigkeit = 0;
      if (meta.einheit === "%") genauigkeit = 0.0005;
      if (meta.einheit === "Tage") genauigkeit = 0.5;
      if (meta.einheit === "Jahre" || meta.einheit === "Faktor") genauigkeit = 0.05;
      if (Math.abs(differenz) < genauigkeit) {
        differenz = 0;
      }

      // Pfeil und Vorzeichen
      let pfeil = "■ ±";
      if (differenz > 0) pfeil = "▲ +";
      if (differenz < 0) pfeil = "▼ −";

      // Größe der Veränderung mit passender Einheit
      const betrag = Math.abs(differenz);
      let text = "";
      if (meta.einheit === "%") {
        text = zahlDe(betrag * 100, 1) + " %-Pkt.";
      } else if (meta.einheit === "€") {
        // Bei Euro-Beträgen die Veränderung in Prozent zeigen
        if (vorjahr !== 0) {
          text = zahlDe(betrag / Math.abs(vorjahr) * 100, 1) + " %";
        } else {
          text = formatEuro(betrag);
        }
      } else if (meta.einheit === "Tage") {
        text = zahlDe(betrag, 0) + " Tage";
      } else if (meta.einheit === "Jahre") {
        text = zahlDe(betrag, 1) + " Jahre";
      } else {
        text = zahlDe(betrag, 1) + "x";
      }

      // Ist die Veränderung gut oder schlecht?
      let klasse = "";
      if (differenz !== 0) {
        let gestiegenIstGut = true;               // "höher" und Euro-Beträge (Cashflow)
        if (meta.richtung === "niedriger") {
          gestiegenIstGut = false;
        }
        const gestiegen = differenz > 0;
        if (gestiegen === gestiegenIstGut) {
          klasse = "besser";
        } else {
          klasse = "schlechter";
        }
      }

      return { text: pfeil + text, klasse: klasse };
    }


    // ============================================================
    // Score (0–100 Punkte)
    // ============================================================

    // Score einer Säule = Durchschnitt der Punkte aller bewerteten Kennzahlen dieser Säule
    function berechneSaeulenScore(eintrag, saeule) {
      let summe = 0;
      let anzahl = 0;

      for (const meta of KENNZAHLEN_META) {
        if (meta.saeule !== saeule) {
          continue;
        }
        const ampel = bewerteKennzahl(meta, eintrag.kennzahlen[meta.id]);
        // Nur Kennzahlen mit Ampelfarbe zählen ("info" und "na" bekommen keine Punkte)
        if (ampel in PUNKTE_JE_AMPEL) {
          summe = summe + PUNKTE_JE_AMPEL[ampel];
          anzahl = anzahl + 1;
        }
      }

      if (anzahl === 0) {
        return null;
      }
      return summe / anzahl;
    }

    // Gesamtscore = gewichteter Durchschnitt der Säulen
    function berechneGesamtScore(eintrag) {
      let summe = 0;
      let summeGewichte = 0;

      for (const saeule in SAEULEN_GEWICHTE) {
        const score = berechneSaeulenScore(eintrag, saeule);
        if (score === null) {
          continue; // Säule ohne berechenbare Kennzahlen weglassen
        }
        summe = summe + score * SAEULEN_GEWICHTE[saeule];
        summeGewichte = summeGewichte + SAEULEN_GEWICHTE[saeule];
      }

      if (summeGewichte === 0) {
        return null;
      }
      return summe / summeGewichte;
    }

    // Ampelfarbe für einen Score
    function scoreAmpel(score) {
      if (score === null) return "na";
      if (score >= SCORE_GRUEN) return "gruen";
      if (score >= SCORE_GELB) return "gelb";
      if (score >= SCORE_ORANGE) return "orange";
      return "rot";
    }

    // Eine Tabellenzeile für den Score (Säule oder Gesamt)
    function scoreZeile(name, scores) {
      const zeile = document.createElement("tr");
      zeile.appendChild(neuesElement("td", name));

      // Ein Feld pro Jahr
      for (const score of scores) {
        const ampel = scoreAmpel(score);
        let text = "–";
        if (score !== null) {
          text = zahlDe(score, 0);
        }
        const feld = neuesElement("td", text, "wert ampel-" + ampel);
        feld.title = AMPEL_TEXT[ampel];
        zeile.appendChild(feld);
      }

      // Vergleich: letztes Jahr gegenüber vorletztem Jahr
      if (scores.length > 1) {
        const aktuell = scores[scores.length - 1];
        const vorjahr = scores[scores.length - 2];
        const feld = neuesElement("td", "–", "vergleich");

        if (aktuell !== null && vorjahr !== null) {
          const differenz = aktuell - vorjahr;
          if (differenz > 0) {
            feld.textContent = "▲ +" + zahlDe(differenz, 0) + " Pkt.";
            feld.classList.add("besser");
          } else if (differenz < 0) {
            feld.textContent = "▼ −" + zahlDe(-differenz, 0) + " Pkt.";
            feld.classList.add("schlechter");
          } else {
            feld.textContent = "■ ±0 Pkt.";
          }
        }
        zeile.appendChild(feld);
      }
      return zeile;
    }

    function baueScoreKarte(jahre) {
      const karte = neueKarte("Pre-Rating Score (0–100)", "score-card");
      const tabelle = document.createElement("table");
      tabelle.className = "kennzahlen-tabelle";

      // Kopfzeile
      const kopf = document.createElement("tr");
      kopf.appendChild(neuesElement("th", "Säule (Gewicht)"));
      for (const eintrag of jahre) {
        kopf.appendChild(neuesElement("th", "GJ " + eintrag.gj, "rechts"));
      }
      if (jahre.length > 1) {
        kopf.appendChild(neuesElement("th", "Δ Vorjahr", "rechts"));
      }
      tabelle.appendChild(kopf);

      // Eine Zeile pro Säule
      for (const saeule in SAEULEN_GEWICHTE) {
        const scores = [];
        for (const eintrag of jahre) {
          scores.push(berechneSaeulenScore(eintrag, saeule));
        }
        const name = saeule + " (" + zahlDe(SAEULEN_GEWICHTE[saeule] * 100, 0) + " %)";
        tabelle.appendChild(scoreZeile(name, scores));
      }

      // Zeile für den Gesamtscore
      const gesamtScores = [];
      for (const eintrag of jahre) {
        gesamtScores.push(berechneGesamtScore(eintrag));
      }
      const gesamtZeile = scoreZeile("Gesamtbewertung", gesamtScores);
      gesamtZeile.className = "gesamt";
      tabelle.appendChild(gesamtZeile);

      const scrollBereich = document.createElement("div");
      scrollBereich.className = "kennzahlen-scroll";
      scrollBereich.appendChild(tabelle);
      karte.appendChild(scrollBereich);

      karte.appendChild(neuerHinweis(
        "Punkte je Kennzahl: Grün 100, Gelb 70, Orange 35, Rot 0. Säulen-Score = Durchschnitt, Gesamt = gewichteter Durchschnitt. " +
        "Ampel: Grün ab 75, Gelb ab 55, Orange ab 35, darunter Rot. Nicht berechenbare Kennzahlen werden ignoriert. " +
        "Das ist ein Pre-Rating aus harten Faktoren und ersetzt kein Bankrating."
      ));

      // Score-Karte ganz oben anzeigen (vor den Jahres-Karten)
      container.parentElement.insertBefore(karte, container);
    }


    // ============================================================
    // Kennzahlen-Tabelle
    // ============================================================

    function baueKennzahlenTabelle(jahre) {
      // Wenn keine Kennzahlen da sind, kommt das Ergebnis von einer alten app.py aus dem Browser-Cache
      if (jahre.length === 0 || !jahre[0].kennzahlen) {
        const hinweis = neuesElement("div",
          "Kennzahlen fehlen: Der Browser hat eine alte Version der Analyse geladen. " +
          "Bitte die Startseite mit Strg+F5 neu laden und die Analyse erneut starten.",
          "result-card kennzahlen-card");
        container.parentElement.appendChild(hinweis);
        return;
      }

      baueScoreKarte(jahre);

      // Für den Vorjahresvergleich: letztes und vorletztes Jahr
      const mitVergleich = jahre.length > 1;
      const aktuellesJahr = jahre[jahre.length - 1];
      const vorjahr = jahre[jahre.length - 2];

      const karte = neueKarte("Kennzahlen aus Bilanz und GuV", "kennzahlen-card");
      karte.appendChild(neueLegende());

      const tabelle = document.createElement("table");
      tabelle.className = "kennzahlen-tabelle";

      // Kopfzeile
      const kopf = document.createElement("tr");
      kopf.appendChild(neuesElement("th", "Kennzahl"));
      for (const eintrag of jahre) {
        kopf.appendChild(neuesElement("th", "GJ " + eintrag.gj, "rechts"));
      }
      if (mitVergleich) {
        kopf.appendChild(neuesElement("th", "Δ " + vorjahr.gj + " → " + aktuellesJahr.gj, "rechts"));
      }
      kopf.appendChild(neuesElement("th", "Ziel (Grün)"));
      tabelle.appendChild(kopf);

      let anzahlSpalten = jahre.length + 2;
      if (mitVergleich) {
        anzahlSpalten = anzahlSpalten + 1;
      }

      // Eine Zeile pro Kennzahl
      let letzteSaeule = "";
      for (const meta of KENNZAHLEN_META) {

        // Neue Säule -> Zwischenüberschrift
        if (meta.saeule !== letzteSaeule) {
          letzteSaeule = meta.saeule;
          const ueberschrift = document.createElement("tr");
          ueberschrift.className = "saeule";
          const feld = neuesElement("th", meta.saeule);
          feld.colSpan = anzahlSpalten;
          ueberschrift.appendChild(feld);
          tabelle.appendChild(ueberschrift);
        }

        const zeile = document.createElement("tr");

        // 1. Spalte: Name, Bedeutung (Kern/Wichtig/Ergänzend) und Formel
        const nameFeld = neuesElement("td", meta.id + " " + meta.name);
        nameFeld.title = meta.hinweis;
        nameFeld.appendChild(neuesElement("span", meta.bedeutung, "bedeutung bedeutung-" + meta.bedeutung.toLowerCase()));
        nameFeld.appendChild(neuesElement("span", meta.formel, "formel"));
        zeile.appendChild(nameFeld);

        // Ein Feld pro Jahr, eingefärbt nach Ampel
        for (const eintrag of jahre) {
          const ergebnis = eintrag.kennzahlen[meta.id];
          const ampel = bewerteKennzahl(meta, ergebnis);

          let wert = null;
          let tooltip = AMPEL_TEXT[ampel];
          if (ergebnis) {
            wert = ergebnis.wert;
            if (ergebnis.hinweis) {
              tooltip = tooltip + " – " + ergebnis.hinweis;
            }
          }

          const feld = neuesElement("td", formatKennzahl(meta, wert), "wert ampel-" + ampel);
          feld.title = tooltip;
          zeile.appendChild(feld);
        }

        // Vergleich mit dem Vorjahr (nur bei Kennzahlen mit trend: true)
        if (mitVergleich) {
          const feld = neuesElement("td", "", "vergleich");
          const jetzt = aktuellesJahr.kennzahlen[meta.id];
          const vorher = vorjahr.kennzahlen[meta.id];
          if (meta.trend && jetzt && vorher) {
            const vergleich = vergleichMitVorjahr(meta, jetzt.wert, vorher.wert);
            feld.textContent = vergleich.text;
            if (vergleich.klasse !== "") {
              feld.classList.add(vergleich.klasse);
            }
          }
          zeile.appendChild(feld);
        }

        // Letzte Spalte: Zielwert
        zeile.appendChild(neuesElement("td", zielText(meta), "ziel"));
        tabelle.appendChild(zeile);
      }

      const scrollBereich = document.createElement("div");
      scrollBereich.className = "kennzahlen-scroll";
      scrollBereich.appendChild(tabelle);
      karte.appendChild(scrollBereich);

      karte.appendChild(neuerHinweis(
        "Schwellenwerte sind Orientierungswerte (Faustwerte), keine Bankvorgaben, und sollten je Branche angepasst werden. " +
        "Langfristiges Fremdkapital: laut Spalte \"Fristigkeit\" (kurz/lang); ohne diese Spalte gelten Darlehen/Bankverbindlichkeiten und Pensionsrückstellungen als langfristig. " +
        "C05–C07 brauchen die Zusatzangaben Tilgung, Entnahmen/Ausschüttungen und Investitionen in der GuV-Datei. " +
        "Vorjahresvergleich (grün = verbessert, rot = verschlechtert) bei ausgewählten Kennzahlen. Mit der Maus über einen Wert fahren für Details."
      ));

      container.parentElement.appendChild(karte);
    }


    // ============================================================
    // Weiche Faktoren (Checkliste zum Aufklappen)
    // ============================================================

    function baueWeicheFaktoren() {
      const karte = neueKarte("Weiche Faktoren (nicht aus Bilanz/GuV ableitbar)", "kennzahlen-card");

      // <details> = Bereich, den man auf- und zuklappen kann
      const aufklappen = document.createElement("details");
      aufklappen.appendChild(neuesElement("summary",
        "Checkliste mit " + WEICHE_FAKTOREN.length + " Kriterien anzeigen, die Banken zusätzlich prüfen"));

      const tabelle = document.createElement("table");
      tabelle.className = "kennzahlen-tabelle";

      const kopf = document.createElement("tr");
      kopf.appendChild(neuesElement("th", "Kriterium"));
      kopf.appendChild(neuesElement("th", "Prüffrage"));
      kopf.appendChild(neuesElement("th", "Positiv"));
      kopf.appendChild(neuesElement("th", "Negativ"));
      kopf.appendChild(neuesElement("th", "Einfluss"));
      tabelle.appendChild(kopf);

      let letzterBereich = "";
      for (const faktor of WEICHE_FAKTOREN) {
        // Neuer Bereich -> Zwischenüberschrift
        if (faktor.bereich !== letzterBereich) {
          letzterBereich = faktor.bereich;
          const ueberschrift = document.createElement("tr");
          ueberschrift.className = "saeule";
          const feld = neuesElement("th", faktor.bereich);
          feld.colSpan = 5;
          ueberschrift.appendChild(feld);
          tabelle.appendChild(ueberschrift);
        }

        const zeile = document.createElement("tr");
        zeile.appendChild(neuesElement("td", faktor.kriterium));
        zeile.appendChild(neuesElement("td", faktor.frage));
        zeile.appendChild(neuesElement("td", faktor.positiv));
        zeile.appendChild(neuesElement("td", faktor.negativ));
        zeile.appendChild(neuesElement("td", faktor.einfluss));
        tabelle.appendChild(zeile);
      }

      const scrollBereich = document.createElement("div");
      scrollBereich.className = "kennzahlen-scroll";
      scrollBereich.appendChild(tabelle);
      aufklappen.appendChild(scrollBereich);
      karte.appendChild(aufklappen);

      container.parentElement.appendChild(karte);
    }

    const rawResults = params.get("results");
    if (rawResults) {
      try {
        ergebnisse = JSON.parse(rawResults);
      } catch (e) {
        ergebnisse = [];
      }
    }

    // Fallback für ältere Links mit Einzelwerten
    if (!ergebnisse.length) {
      const msg = params.get("eq_msg") || "Keine Daten gefunden.";
      const ek = parseFloat(params.get("ek") || "0");
      const bs = parseFloat(params.get("bs") || "0");
      ergebnisse = [{ gj: "", msg, ek, bs }];
    }

    const container = document.getElementById("charts-container");

    function parseJahrWert(jahrText) {
      const jahr = Number(String(jahrText || "").trim());
      return Number.isFinite(jahr) ? jahr : null;
    }

    function cagrPunkte(cagrProzent, brancheWert) {
      if (brancheWert === "tech") {
        if (cagrProzent < 2.5) return 0;
        if (cagrProzent < 6.3) return 1;
        if (cagrProzent < 7.2) return 2;
        if (cagrProzent < 7.8) return 3;
        if (cagrProzent < 8.7) return 4;
        if (cagrProzent < 9.2) return 5;
        if (cagrProzent < 10.4) return 6;
        if (cagrProzent < 13.3) return 7;
        if (cagrProzent < 14.6) return 8;
        if (cagrProzent <= 15) return 9;
        return 10;
      }

      if (brancheWert === "banken") {
        if (cagrProzent < 1.4) return 0;
        if (cagrProzent < 4.9) return 1;
        if (cagrProzent < 5.9) return 2;
        if (cagrProzent < 6.6) return 3;
        if (cagrProzent < 8.1) return 4;
        if (cagrProzent < 8.7) return 5;
        if (cagrProzent < 10.4) return 6;
        if (cagrProzent < 12.0) return 7;
        if (cagrProzent < 13.6) return 8;
        if (cagrProzent <= 14.0) return 9;
        return 10;
      }

      if (brancheWert === "immobilien") {
        if (cagrProzent < -19.5) return 0;
        if (cagrProzent < -15.5) return 1;
        if (cagrProzent < -11.0) return 2;
        if (cagrProzent < -3.6) return 3;
        if (cagrProzent < 3.2) return 4;
        if (cagrProzent < 5.8) return 5;
        if (cagrProzent < 6.5) return 6;
        if (cagrProzent < 7.6) return 7;
        if (cagrProzent < 9.8) return 8;
        if (cagrProzent <= 10.0) return 9;
        return 10;
      }

      if (brancheWert === "industrie") {
        if (cagrProzent < -6.1) return 0;
        if (cagrProzent < -3.1) return 1;
        if (cagrProzent < 1.1) return 2;
        if (cagrProzent < 3.5) return 3;
        if (cagrProzent < 4.1) return 4;
        if (cagrProzent < 4.7) return 5;
        if (cagrProzent < 5.4) return 6;
        if (cagrProzent < 6.3) return 7;
        if (cagrProzent < 9.7) return 8;
        if (cagrProzent <= 10.0) return 9;
        return 10;
      }

      if (cagrProzent < -6.1) return 0;
      if (cagrProzent < -3.1) return 1;
      if (cagrProzent < 1.1) return 2;
      if (cagrProzent < 3.5) return 3;
      if (cagrProzent < 4.1) return 4;
      if (cagrProzent < 4.7) return 5;
      if (cagrProzent < 5.4) return 6;
      if (cagrProzent < 6.3) return 7;
      if (cagrProzent < 9.7) return 8;
      if (cagrProzent <= 10.0) return 9;
      return 10;
    }

    function standardabweichung(arr) {
      if (!arr.length) return 0;
      const mittelwert = arr.reduce((sum, x) => sum + x, 0) / arr.length;
      const varianz = arr.reduce((sum, x) => sum + ((x - mittelwert) ** 2), 0) / arr.length;
      return Math.sqrt(varianz);
    }

    function stabilitaetPunkte(stabilWerte) {
      const sd = standardabweichung(stabilWerte);
      if (sd < 1.5) return { punkte: 10, sd };
      if (sd < 3) return { punkte: 8, sd };
      if (sd < 5) return { punkte: 6, sd };
      if (sd < 7) return { punkte: 4, sd };
      if (sd < 10) return { punkte: 2, sd };
      return { punkte: 0, sd };
    }

    function baueAnalyseBericht(daten) {
      if (daten.length < 2) {
        return;
      }

      const profil = BRANCHEN_PROFIL[branche] || BRANCHEN_PROFIL.default;
      const erstes = daten[0];
      const letztes = daten[daten.length - 1];
      const startUmsatz = erstes.umsatz;
      const endUmsatz = letztes.umsatz;
      const n = daten.length;

      let cagr = 0;
      let cagrBerechenbar = false;
      if (startUmsatz > 0 && n > 0) {
        cagr = (endUmsatz / startUmsatz) ** (1 / n) - 1;
        cagrBerechenbar = Number.isFinite(cagr);
      }

      const wachstum = daten
        .map((eintrag, index, arr) => {
          if (index === 0) return null;
          const vorher = arr[index - 1].umsatz;
          if (vorher <= 0) return null;
          return ((eintrag.umsatz - vorher) / vorher) * 100;
        })
        .filter((w) => w !== null);

      const cagrProzent = cagrBerechenbar ? cagr * 100 : 0;
      const punkteCagr = cagrBerechenbar ? cagrPunkte(cagrProzent, branche) : 0;
      const stabil = stabilitaetPunkte(wachstum);
      const punkteGesamt = (punkteCagr * profil.cagrGewicht) + (stabil.punkte * profil.stabilGewicht);

      const report = document.createElement("div");
      report.className = "result-card report-card";

      const titel = document.createElement("h2");
      titel.style.marginTop = "0";
      titel.style.marginBottom = "8px";
      titel.style.textAlign = "left";
      titel.textContent = "Analyse Bericht";

      const grid = document.createElement("div");
      grid.className = "report-grid";
      grid.style.gridTemplateColumns = "1fr";

      const zeilen = [
        `CAGR Ergebnis: ${cagrBerechenbar ? cagrProzent.toFixed(2) + "%" : "nicht berechenbar"}`,
        `Umsatzstabilität: ${stabil.sd.toFixed(2)}%`,
        `Gesamtpunkte (gewichtet): ${punkteGesamt.toFixed(2)} / 10`,
      ];

      zeilen.forEach((text) => {
        const p = document.createElement("p");
        p.className = "report-line";
        p.textContent = text;
        grid.appendChild(p);
      });

      report.appendChild(titel);
      report.appendChild(grid);

      container.parentElement.insertBefore(report, container);
    }

    ergebnisse.forEach((eintrag, index) => {
      const ek = Number(eintrag.ek || 0);
      const bs = Number(eintrag.bs || 0);
      const restAktiva = Math.max(bs - ek, 0);
      const overview = eintrag.overview || {};
      const fremdkapital = Number(overview["Fremdkapital"] ?? overview["Freumdkapital"] ?? 0);

      let verschuldungsgradText = "Der Verschuldungsgrad beträgt nicht berechenbar";
      if (ek > 0) {
        const verschuldungsgrad = (fremdkapital / ek) * 100;
        verschuldungsgradText = `Der Verschuldungsgrad beträgt ${verschuldungsgrad.toFixed(2)}%`;
      }

      const block = document.createElement("div");
      block.className = "result-card";

      const titel = document.createElement("h2");
      titel.style.textAlign = "center";
      titel.style.fontSize = "20px";
      titel.style.marginBottom = "10px";
      titel.textContent = eintrag.gj ? `GJ ${eintrag.gj}` : "Ergebnis";

      const text = document.createElement("p");
      text.style.fontSize = "18px";
      text.style.marginBottom = "20px";
      text.textContent = eintrag.msg || "Keine Daten gefunden.";

      const canvas = document.createElement("canvas");
      canvas.id = `eq-chart-${index}`;
      canvas.width = 400;
      canvas.height = 400;
      canvas.style.maxWidth = "400px";
      canvas.style.display = "block";
      canvas.style.margin = "0 auto";

      const verschuldungsgradP = document.createElement("p");
      verschuldungsgradP.style.textAlign = "center";
      verschuldungsgradP.style.fontSize = "17px";
      verschuldungsgradP.style.marginTop = "12px";
      verschuldungsgradP.style.marginBottom = "12px";
      verschuldungsgradP.textContent = verschuldungsgradText;

      block.appendChild(titel);
      block.appendChild(text);
      block.appendChild(canvas);
      block.appendChild(verschuldungsgradP);

      const tableTitle = document.createElement("h3");
      tableTitle.style.textAlign = "center";
      tableTitle.style.fontSize = "18px";
      tableTitle.style.marginTop = "25px";
      tableTitle.style.marginBottom = "12px";
      tableTitle.textContent = eintrag.gj ? `Financel Overview ${eintrag.gj}` : "Financel Overview";

      const table = document.createElement("table");
      table.style.width = "100%";
      table.style.maxWidth = "640px";
      table.style.margin = "0 auto";
      table.style.borderCollapse = "collapse";
      table.style.background = "#1f2f40";
      table.style.border = "1px solid #36516b";

      const kopf = document.createElement("tr");
      const kopfLinks = document.createElement("th");
      kopfLinks.textContent = "Kennzahl";
      kopfLinks.style.padding = "10px";
      kopfLinks.style.textAlign = "left";
      kopfLinks.style.borderBottom = "1px solid #36516b";

      const kopfRechts = document.createElement("th");
      kopfRechts.textContent = "Wert";
      kopfRechts.style.padding = "10px";
      kopfRechts.style.textAlign = "right";
      kopfRechts.style.borderBottom = "1px solid #36516b";

      kopf.appendChild(kopfLinks);
      kopf.appendChild(kopfRechts);
      table.appendChild(kopf);

      const zeilen = [
        ["Gesamtumsatz", overview["Gesamtumsatz"]],
        ["EBITA", overview["EBITA"]],
        ["Jahresüberschuss", overview["Jahresüberschuss"]],
        ["Bilanzsumme", overview["Bilanzsumme"]],
        ["Eigenkapital", overview["Eigenkapital"]],
        ["Fremdkapital", overview["Fremdkapital"] ?? overview["Freumdkapital"]],
        ["Cash", overview["Cash"]],
      ];

      zeilen.forEach((eintragZeile) => {
        const tr = document.createElement("tr");

        const tdName = document.createElement("td");
        tdName.textContent = eintragZeile[0];
        tdName.style.padding = "10px";
        tdName.style.borderBottom = "1px solid #2b4157";

        const tdWert = document.createElement("td");
        tdWert.textContent = formatWert(eintragZeile[0], eintragZeile[1]);
        tdWert.style.padding = "10px";
        tdWert.style.textAlign = "right";
        tdWert.style.borderBottom = "1px solid #2b4157";

        tr.appendChild(tdName);
        tr.appendChild(tdWert);
        table.appendChild(tr);
      });

      block.appendChild(tableTitle);
      block.appendChild(table);
      container.appendChild(block);

      if (!(ek > 0 || bs > 0)) {
        return;
      }

      new Chart(canvas, {
        type: "pie",
        plugins: [ChartDataLabels],
        data: {
          labels: ["Eigenkapital", "Restliche Aktiva"],
          datasets: [{
            data: [ek, restAktiva],
            backgroundColor: ["#4a90e2", "#e25c4a"],
            borderColor: ["#1a2a3a", "#1a2a3a"],
            borderWidth: 2
          }]
        },
        options: {
          plugins: {
            legend: { labels: { color: "#e8eef6", font: { size: 14 } } },
            datalabels: {
              color: "#ffffff",
              font: { size: 14, weight: "bold" },
              formatter: (value, ctx) => {
                const total = ctx.chart.data.datasets[0].data.reduce((a, b) => a + b, 0);
                if (total === 0) {
                  return "0.0%";
                }
                return (value / total * 100).toFixed(1) + "%";
              }
            }
          }
        }
      });
    });

    const trendDaten = ergebnisse
      .map((eintrag) => {
        const overview = eintrag.overview || {};
        return {
          gj: String(eintrag.gj || "").trim(),
          umsatz: Number(overview["Gesamtumsatz"] || 0),
          eigenkapital: Number(overview["Eigenkapital"] ?? eintrag.ek ?? 0)
        };
      })
      .filter((eintrag) => eintrag.gj !== "")
      .sort((a, b) => {
        const aJahr = parseJahrWert(a.gj);
        const bJahr = parseJahrWert(b.gj);

        if (aJahr !== null && bJahr !== null) {
          return aJahr - bJahr;
        }
        return a.gj.localeCompare(b.gj, "de");
      });

    baueAnalyseBericht(trendDaten);

    // Jahre sortieren (ältestes zuerst), dann Score, Kennzahlen und weiche Faktoren anzeigen
    const jahreSortiert = ergebnisse.slice();
    jahreSortiert.sort(function (a, b) {
      return Number(a.gj) - Number(b.gj);
    });
    baueKennzahlenTabelle(jahreSortiert);
    baueWeicheFaktoren();

    if (trendDaten.length > 0) {
      const jahre = trendDaten.map((eintrag) => eintrag.gj);
      const eigenkapitalWerte = trendDaten.map((eintrag) => eintrag.eigenkapital);

      const umsatzwachstumWerte = trendDaten.map((eintrag, index, arr) => {
        if (index === 0) {
          return null;
        }

        const vorher = arr[index - 1].umsatz;
        if (vorher <= 0) {
          return null;
        }

        return ((eintrag.umsatz - vorher) / vorher) * 100;
      });

      const trendCard = document.createElement("div");
      trendCard.className = "result-card trend-card";

      const trendTitle = document.createElement("h2");
      trendTitle.style.textAlign = "center";
      trendTitle.style.fontSize = "20px";
      trendTitle.style.marginBottom = "14px";
      trendTitle.textContent = "Umsatzwachstum und Eigenkapitalentwicklung";

      const trendWrap = document.createElement("div");
      trendWrap.className = "trend-chart-wrap";

      const trendCanvas = document.createElement("canvas");
      trendCanvas.id = "trend-chart";

      trendWrap.appendChild(trendCanvas);
      trendCard.appendChild(trendTitle);
      trendCard.appendChild(trendWrap);
      container.parentElement.appendChild(trendCard);

      new Chart(trendCanvas, {
        type: "line",
        data: {
          labels: jahre,
          datasets: [
            {
              label: "Umsatzwachstum (%)",
              data: umsatzwachstumWerte,
              yAxisID: "yPercent",
              borderColor: "#4a90e2",
              backgroundColor: "rgba(74, 144, 226, 0.2)",
              borderWidth: 3,
              tension: 0.3,
              pointRadius: 4,
              pointHoverRadius: 6,
              spanGaps: true
            },
            {
              label: "Eigenkapital (EUR)",
              data: eigenkapitalWerte,
              yAxisID: "yEuro",
              borderColor: "#5dbf8a",
              backgroundColor: "rgba(93, 191, 138, 0.2)",
              borderWidth: 3,
              tension: 0.3,
              pointRadius: 4,
              pointHoverRadius: 6
            }
          ]
        },
        options: {
          maintainAspectRatio: false,
          interaction: {
            mode: "index",
            intersect: false
          },
          plugins: {
            legend: {
              labels: {
                color: "#e8eef6",
                font: { size: 13 }
              }
            },
            datalabels: {
              display: false
            },
            tooltip: {
              callbacks: {
                label: (ctx) => {
                  const label = ctx.dataset.label || "";
                  const value = ctx.parsed.y;

                  if (ctx.dataset.yAxisID === "yPercent") {
                    if (value === null || Number.isNaN(value)) {
                      return `${label}: keine Basis`;
                    }
                    return `${label}: ${value.toFixed(2)}%`;
                  }

                  return `${label}: ${formatEuro(value)}`;
                }
              }
            }
          },
          scales: {
            x: {
              ticks: { color: "#c8ddf5" },
              grid: { color: "rgba(200, 221, 245, 0.12)" }
            },
            yPercent: {
              type: "linear",
              position: "left",
              ticks: {
                color: "#4a90e2",
                callback: (value) => `${value}%`
              },
              grid: { color: "rgba(200, 221, 245, 0.12)" }
            },
            yEuro: {
              type: "linear",
              position: "right",
              ticks: {
                color: "#5dbf8a",
                callback: (value) => formatEuro(value)
              },
              grid: {
                drawOnChartArea: false
              }
            }
          }
        }
      });
    }
  </script>
</body>
</html>
