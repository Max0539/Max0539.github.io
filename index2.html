<!DOCTYPE html>
<html>
<head>
  <title>Finanzanalyse – Ergebnis</title>
  <link rel="stylesheet" href="index.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2"></script>
  <style>
    #charts-container {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 24px;
      align-items: start;
    }

    .result-card {
      background: #162433;
      border: 1px solid #2b4157;
      border-radius: 10px;
      padding: 16px;
    }

    .report-card {
      margin-bottom: 22px;
    }

    .report-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px 24px;
      margin-top: 10px;
    }

    .report-line {
      margin: 0;
      font-size: 16px;
      line-height: 1.35;
    }

    .trend-card {
      margin-top: 24px;
    }

    .trend-chart-wrap {
      position: relative;
      height: 420px;
    }

    .kennzahlen-card {
      margin-top: 24px;
    }

    .kennzahlen-legende {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 16px;
      margin: 0 0 14px 0;
      font-size: 13px;
      color: #b0c4de;
    }

    .kennzahlen-legende span::before {
      content: "";
      display: inline-block;
      width: 12px;
      height: 12px;
      border-radius: 3px;
      margin-right: 6px;
      vertical-align: -1px;
      background: var(--farbe);
    }

    .kennzahlen-scroll {
      overflow-x: auto;
    }

    .kennzahlen-tabelle {
      width: 100%;
      border-collapse: collapse;
      background: #1f2f40;
      border: 1px solid #36516b;
      font-size: 14px;
    }

    .kennzahlen-tabelle th,
    .kennzahlen-tabelle td {
      padding: 8px 10px;
      border-bottom: 1px solid #2b4157;
      text-align: left;
      vertical-align: top;
    }

    .kennzahlen-tabelle td.wert {
      text-align: right;
      white-space: nowrap;
      font-weight: bold;
      color: #ffffff;
    }

    .kennzahlen-tabelle tr.saeule th {
      background: #24384d;
      color: #c8ddf5;
      font-size: 15px;
    }

    .kennzahlen-tabelle .formel {
      display: block;
      font-size: 12px;
      color: #8aaac8;
      margin-top: 2px;
    }

    .kennzahlen-tabelle .ziel {
      font-size: 12px;
      color: #b0c4de;
      white-space: nowrap;
    }

    .ampel-gruen { background: #2e7d4f; }
    .ampel-gelb { background: #a88400; }
    .ampel-orange { background: #c2651a; }
    .ampel-rot { background: #a83838; }
    .ampel-info { background: #2f4a66; }
    .ampel-na { background: #3a4a5a; color: #b0c4de !important; font-weight: normal !important; }

    @media (max-width: 980px) {
      #charts-container {
        grid-template-columns: 1fr;
      }

      .report-grid {
        grid-template-columns: 1fr;
      }

      .trend-chart-wrap {
        height: 320px;
      }
    }
  </style>
</head>
<body>
  <h1 style="text-align:center; font-family:Arial,sans-serif; color:#e8eef6;">Analyseergebnis</h1>

  <div style="font-family:Arial,sans-serif; color:#e8eef6; max-width:1300px; margin:30px auto; padding:0 12px;">
    <div id="charts-container"></div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    let ergebnisse = [];
    const branche = (params.get("branche") || "").trim().toLowerCase();

    const BRANCHEN_PROFIL = {
      tech: { cagrGewicht: 0.8, stabilGewicht: 0.2 },
      mittelstand: { cagrGewicht: 0.7, stabilGewicht: 0.3 },
      industrie: { cagrGewicht: 0.65, stabilGewicht: 0.35 },
      immobilien: { cagrGewicht: 0.6, stabilGewicht: 0.4 },
      banken: { cagrGewicht: 0.6, stabilGewicht: 0.4 },
      default: { cagrGewicht: 0.7, stabilGewicht: 0.3 }
    };

    function formatEuro(zahl) {
      const wert = Number(zahl || 0);
      return new Intl.NumberFormat("de-DE", {
        minimumFractionDigits: 2,
        maximumFractionDigits: 2
      }).format(wert) + " EUR";
    }

    function formatWert(name, wert) {
      if (name === "Jahresüberschuss" && typeof wert === "string") {
        return wert;
      }
      return formatEuro(wert);
    }

    const KENNZAHLEN_META = [
      {"id": "K01", "saeule": "Kapitalstruktur", "name": "Eigenkapitalquote", "formel": "Eigenkapital / Bilanzsumme", "einheit": "%", "richtung": "hoeher", "schwellen": [0.3, 0.2, 0.1], "hinweis": "Zentrale Kennzahl im Bankrating. Stark branchenabhängig (Handel/Bau niedriger, Industrie höher). Bilanzsumme ggf. bereinigen (z. B. erhaltene Anzahlungen, Gesellschafterdarlehen)."},
      {"id": "K02", "saeule": "Kapitalstruktur", "name": "Fremdkapitalquote", "formel": "Fremdkapital / Bilanzsumme", "einheit": "%", "richtung": "niedriger", "schwellen": [0.7, 0.8, 0.9], "hinweis": "Gegenstück zur Eigenkapitalquote (zusammen 100 %)."},
      {"id": "K03", "saeule": "Kapitalstruktur", "name": "Verschuldungsgrad", "formel": "Fremdkapital / Eigenkapital", "einheit": "%", "richtung": "niedriger", "schwellen": [1.5, 2, 4], "hinweis": "Banken erwarten laut Quellen max. ca. 200 % (Faktor 2). Bei negativem Eigenkapital wird Rot gesetzt."},
      {"id": "K04", "saeule": "Kapitalstruktur", "name": "Anlagenintensität", "formel": "Anlagevermögen / Bilanzsumme", "einheit": "%", "richtung": "niedriger", "schwellen": [0.4, 0.6, 0.8], "hinweis": "Hohe Anlagenintensität gilt für Banken als weniger günstig, da Maschinen/Gebäude in Notzeiten schlechter verwertbar sind. Sehr branchenabhängig."},
      {"id": "K05", "saeule": "Kapitalstruktur", "name": "Anlagendeckung I", "formel": "Eigenkapital / Anlagevermögen", "einheit": "%", "richtung": "hoeher", "schwellen": [1, 0.7, 0.4], "hinweis": "Zeigt, ob das Anlagevermögen durch Eigenkapital gedeckt ist."},
      {"id": "K06", "saeule": "Kapitalstruktur", "name": "Anlagendeckung II", "formel": "(Eigenkapital + langfr. Fremdkapital) / Anlagevermögen", "einheit": "%", "richtung": "hoeher", "schwellen": [1.2, 1, 0.8], "hinweis": "Goldene Bilanzregel: langfristig gebundenes Vermögen sollte langfristig finanziert sein (mind. 100 %)."},
      {"id": "K07", "saeule": "Kapitalstruktur", "name": "Bankverbindlichkeitenquote", "formel": "Verbindlichkeiten ggü. Banken / Bilanzsumme", "einheit": "%", "richtung": "niedriger", "schwellen": [0.3, 0.45, 0.6], "hinweis": "Abhängigkeit von Bankfinanzierung."},
      {"id": "K08", "saeule": "Kapitalstruktur", "name": "Netto-Finanzverbindlichkeitenquote", "formel": "(Finanzverbindlichkeiten – liquide Mittel) / Bilanzsumme", "einheit": "%", "richtung": "niedriger", "schwellen": [0.25, 0.4, 0.55], "hinweis": "Wird u. a. im Bundesbank-Verfahren (IFRS) verwendet."},
      {"id": "R01", "saeule": "Rentabilität", "name": "Umsatzrentabilität", "formel": "Ergebnis vor Steuern (EBT) / Gesamtleistung", "einheit": "%", "richtung": "hoeher", "schwellen": [0.05, 0.02, 0], "hinweis": "Ertragskraft je Euro Leistung. Immer mit Branchenwerten vergleichen."},
      {"id": "R02", "saeule": "Rentabilität", "name": "Gesamtkapitalrentabilität", "formel": "(EBT + Zinsaufwand) / Bilanzsumme", "einheit": "%", "richtung": "hoeher", "schwellen": [0.08, 0.04, 0.01], "hinweis": "Verzinsung des gesamten eingesetzten Kapitals."},
      {"id": "R03", "saeule": "Rentabilität", "name": "Eigenkapitalrentabilität", "formel": "EBT / Eigenkapital", "einheit": "%", "richtung": "hoeher", "schwellen": [0.15, 0.08, 0.02], "hinweis": "Bei sehr niedrigem EK kann der Wert verzerrt hoch sein. Bei negativem EK wird Rot gesetzt."},
      {"id": "R04", "saeule": "Rentabilität", "name": "EBITDA-Marge", "formel": "EBITDA / Umsatzerlöse (EBITDA = EBT + Zinsaufwand + Abschreibungen)", "einheit": "%", "richtung": "hoeher", "schwellen": [0.12, 0.06, 0.02], "hinweis": "Operative Ertragskraft vor Zinsen und Abschreibungen."},
      {"id": "R05", "saeule": "Rentabilität", "name": "Personalaufwandsquote", "formel": "Personalaufwand / Gesamtleistung", "einheit": "%", "richtung": "niedriger", "schwellen": [0.3, 0.45, 0.6], "hinweis": "Kostenstruktur; stark branchenabhängig (Dienstleistung deutlich höher als Handel)."},
      {"id": "R06", "saeule": "Rentabilität", "name": "Materialaufwandsquote", "formel": "Materialaufwand / Gesamtleistung", "einheit": "%", "richtung": "niedriger", "schwellen": [0.4, 0.55, 0.7], "hinweis": "Kostenstruktur; stark branchenabhängig."},
      {"id": "R07", "saeule": "Rentabilität", "name": "Umsatzwachstum", "formel": "Umsatz aktuell / Umsatz Vorjahr – 1", "einheit": "%", "richtung": "hoeher", "schwellen": [0.03, 0, -0.1], "hinweis": "Entwicklung der Gesamtleistung über mehrere Jahre ist ein Standardkriterium. Starkes Wachstum kann zusätzlich Liquiditätsbedarf auslösen."},
      {"id": "C01", "saeule": "Cashflow & Kapitaldienst", "name": "Cashflow (absolut)", "formel": "Jahresüberschuss + Abschreibungen ± Veränderung Rückstellungen", "einheit": "€", "richtung": "info", "schwellen": null, "hinweis": "Basisgröße für fast alle Cashflow-Kennzahlen. Sollte positiv und über die Jahre stabil sein. Kein fester Schwellenwert."},
      {"id": "C02", "saeule": "Cashflow & Kapitaldienst", "name": "Cashflow-Rate", "formel": "Cashflow / Umsatzerlöse", "einheit": "%", "richtung": "hoeher", "schwellen": [0.08, 0.04, 0.01], "hinweis": "Liquiditätswirksame Ertragskraft je Euro Umsatz."},
      {"id": "C03", "saeule": "Cashflow & Kapitaldienst", "name": "Schuldentilgungsdauer (dynamischer Verschuldungsgrad)", "formel": "(Verbindlichkeiten – liquide Mittel) / Cashflow", "einheit": "Jahre", "richtung": "niedriger", "schwellen": [3, 5, 10], "hinweis": "Wie viele Jahre würde die rechnerische Entschuldung aus dem Cashflow dauern? Bei Cashflow ≤ 0 wird Rot gesetzt."},
      {"id": "C04", "saeule": "Cashflow & Kapitaldienst", "name": "Zinsdeckung", "formel": "EBIT / Zinsaufwand (EBIT = EBT + Zinsaufwand)", "einheit": "Faktor", "richtung": "hoeher", "schwellen": [5, 3, 1.5], "hinweis": "Wie oft werden die Zinsen aus dem operativen Ergebnis verdient? Ratingagenturen nutzen vergleichbar EBITDA/Zinsen."},
      {"id": "L01", "saeule": "Liquidität & Working Capital", "name": "Liquidität 1. Grades (Barliquidität)", "formel": "Liquide Mittel / kurzfr. Verbindlichkeiten", "einheit": "%", "richtung": "hoeher", "schwellen": [0.2, 0.1, 0.05], "hinweis": "Sofort verfügbare Zahlungsfähigkeit."},
      {"id": "L02", "saeule": "Liquidität & Working Capital", "name": "Liquidität 2. Grades (Einzugsliquidität)", "formel": "(Liquide Mittel + Forderungen) / kurzfr. Verbindlichkeiten", "einheit": "%", "richtung": "hoeher", "schwellen": [1, 0.8, 0.5], "hinweis": "Faustregel: mind. 100 % anstreben."},
      {"id": "L03", "saeule": "Liquidität & Working Capital", "name": "Liquidität 3. Grades (Umlaufdeckung)", "formel": "Umlaufvermögen / kurzfr. Verbindlichkeiten", "einheit": "%", "richtung": "hoeher", "schwellen": [1.5, 1.2, 1], "hinweis": "Unter 100 % sind kurzfristige Schulden nicht durch Umlaufvermögen gedeckt."},
      {"id": "L04", "saeule": "Liquidität & Working Capital", "name": "Working Capital (relativ)", "formel": "(Umlaufvermögen – kurzfr. Fremdkapital) / Umsatzerlöse", "einheit": "%", "richtung": "hoeher", "schwellen": [0.1, 0, -0.1], "hinweis": "Positives Working Capital = Finanzierungsspielraum. Lexware nennt auch Verhältnis zum Umsatz zur Vergleichbarkeit."},
      {"id": "L05", "saeule": "Liquidität & Working Capital", "name": "Debitorenziel (DSO)", "formel": "Forderungen aus L+L / Umsatzerlöse × 360", "einheit": "Tage", "richtung": "niedriger", "schwellen": [40, 60, 90], "hinweis": "Durchschnittliche Zahlungsdauer der Kunden. Längere Zahlungsziele verschlechtern die Kennzahlen."},
      {"id": "L06", "saeule": "Liquidität & Working Capital", "name": "Lagerdauer (DIO)", "formel": "Vorräte / Materialaufwand × 360", "einheit": "Tage", "richtung": "niedriger", "schwellen": [45, 90, 150], "hinweis": "Kapitalbindung im Lager. Höherer Warenbestand verschlechtert die Kennzahl."},
      {"id": "L07", "saeule": "Liquidität & Working Capital", "name": "Kreditorenziel (DPO)", "formel": "Verbindlichkeiten aus L+L / Materialaufwand × 360", "einheit": "Tage", "richtung": "info", "schwellen": null, "hinweis": "Nur zur Einordnung. Sehr hohe Werte können auf Zahlungsverzug bei Lieferanten hindeuten, niedrige auf wenig genutzte Lieferantenkredite."},
      {"id": "L08", "saeule": "Liquidität & Working Capital", "name": "Cash Conversion Cycle", "formel": "Debitorenziel + Lagerdauer – Kreditorenziel", "einheit": "Tage", "richtung": "niedriger", "schwellen": [30, 60, 120], "hinweis": "Dauer der Kapitalbindung im operativen Kreislauf."},
    ];

    const AMPEL_TEXT = {
      gruen: "Gut",
      gelb: "Akzeptabel",
      orange: "Kritisch",
      rot: "Schlecht",
      info: "Ohne Bewertung",
      na: "Nicht berechenbar"
    };

    function formatKennzahl(meta, wert) {
      if (wert === null || wert === undefined || !Number.isFinite(wert)) {
        return "–";
      }
      const zahl = (x, stellen) => new Intl.NumberFormat("de-DE", {
        minimumFractionDigits: stellen,
        maximumFractionDigits: stellen
      }).format(x);

      if (meta.einheit === "%") return `${zahl(wert * 100, 1)} %`;
      if (meta.einheit === "€") return formatEuro(wert);
      if (meta.einheit === "Tage") return `${zahl(wert, 0)} Tage`;
      if (meta.einheit === "Jahre") return `${zahl(wert, 1)} Jahre`;
      if (meta.einheit === "Faktor") return `${zahl(wert, 1)}x`;
      return zahl(wert, 2);
    }

    function bewerteKennzahl(meta, ergebnis) {
      if (ergebnis && ergebnis.a) return ergebnis.a;
      const wert = ergebnis ? ergebnis.w : null;
      if (wert === null || wert === undefined || !Number.isFinite(wert)) return "na";
      if (!meta.schwellen || meta.richtung === "info") return "info";

      const [gut, gelb, kritisch] = meta.schwellen;
      if (meta.richtung === "hoeher") {
        if (wert >= gut) return "gruen";
        if (wert >= gelb) return "gelb";
        if (wert >= kritisch) return "orange";
        return "rot";
      }
      if (wert <= gut) return "gruen";
      if (wert <= gelb) return "gelb";
      if (wert <= kritisch) return "orange";
      return "rot";
    }

    function zielText(meta) {
      if (!meta.schwellen || meta.richtung === "info") return "–";
      return `${meta.richtung === "hoeher" ? "≥" : "≤"} ${formatKennzahl(meta, meta.schwellen[0])}`;
    }

    function baueKennzahlenTabelle(daten) {
      const jahre = daten.filter((eintrag) => eintrag.kennzahlen);
      if (!jahre.length) return;

      const card = document.createElement("div");
      card.className = "result-card kennzahlen-card";

      const titel = document.createElement("h2");
      titel.style.textAlign = "center";
      titel.style.fontSize = "20px";
      titel.style.marginBottom = "12px";
      titel.textContent = "Kennzahlen aus Bilanz und GuV";
      card.appendChild(titel);

      const legende = document.createElement("div");
      legende.className = "kennzahlen-legende";
      [
        ["gruen", "#2e7d4f"], ["gelb", "#a88400"], ["orange", "#c2651a"],
        ["rot", "#a83838"], ["info", "#2f4a66"], ["na", "#3a4a5a"]
      ].forEach(([key, farbe]) => {
        const span = document.createElement("span");
        span.style.setProperty("--farbe", farbe);
        span.textContent = AMPEL_TEXT[key];
        legende.appendChild(span);
      });
      card.appendChild(legende);

      const scroll = document.createElement("div");
      scroll.className = "kennzahlen-scroll";
      const table = document.createElement("table");
      table.className = "kennzahlen-tabelle";

      const kopf = document.createElement("tr");
      ["Kennzahl", ...jahre.map((e) => e.gj ? `GJ ${e.gj}` : "Wert"), "Ziel (Grün)"].forEach((text, i) => {
        const th = document.createElement("th");
        th.textContent = text;
        if (i > 0 && i <= jahre.length) th.style.textAlign = "right";
        kopf.appendChild(th);
      });
      table.appendChild(kopf);

      let aktuelleSaeule = "";
      KENNZAHLEN_META.forEach((meta) => {
        if (meta.saeule !== aktuelleSaeule) {
          aktuelleSaeule = meta.saeule;
          const tr = document.createElement("tr");
          tr.className = "saeule";
          const th = document.createElement("th");
          th.colSpan = jahre.length + 2;
          th.textContent = meta.saeule;
          tr.appendChild(th);
          table.appendChild(tr);
        }

        const tr = document.createElement("tr");
        const tdName = document.createElement("td");
        tdName.textContent = `${meta.id} ${meta.name}`;
        tdName.title = meta.hinweis || "";
        const formel = document.createElement("span");
        formel.className = "formel";
        formel.textContent = meta.formel;
        tdName.appendChild(formel);
        tr.appendChild(tdName);

        jahre.forEach((eintrag) => {
          const ergebnis = eintrag.kennzahlen[meta.id] || null;
          const ampel = bewerteKennzahl(meta, ergebnis);
          const td = document.createElement("td");
          td.className = `wert ampel-${ampel}`;
          td.textContent = formatKennzahl(meta, ergebnis ? ergebnis.w : null);
          td.title = [AMPEL_TEXT[ampel], ergebnis && ergebnis.h].filter(Boolean).join(" – ");
          tr.appendChild(td);
        });

        const tdZiel = document.createElement("td");
        tdZiel.className = "ziel";
        tdZiel.textContent = zielText(meta);
        tr.appendChild(tdZiel);

        table.appendChild(tr);
      });

      scroll.appendChild(table);
      card.appendChild(scroll);

      const hinweis = document.createElement("p");
      hinweis.style.fontSize = "12px";
      hinweis.style.color = "#8aaac8";
      hinweis.style.marginTop = "12px";
      hinweis.textContent = "Schwellenwerte sind Orientierungswerte (Faustwerte), keine Bankvorgaben, und sollten je Branche angepasst werden. "
        + "Langfristiges Fremdkapital: Darlehen/Bankverbindlichkeiten und Pensionsrückstellungen, sofern keine Spalte \"Fristigkeit\" (kurz/lang) vorhanden ist. "
        + "Mit der Maus über einen Wert fahren für Details.";
      card.appendChild(hinweis);

      container.parentElement.appendChild(card);
    }

    const rawResults = params.get("results");
    if (rawResults) {
      try {
        ergebnisse = JSON.parse(rawResults);
      } catch (e) {
        ergebnisse = [];
      }
    }

    // Fallback für ältere Links mit Einzelwerten
    if (!ergebnisse.length) {
      const msg = params.get("eq_msg") || "Keine Daten gefunden.";
      const ek = parseFloat(params.get("ek") || "0");
      const bs = parseFloat(params.get("bs") || "0");
      ergebnisse = [{ gj: "", msg, ek, bs }];
    }

    const container = document.getElementById("charts-container");

    function parseJahrWert(jahrText) {
      const jahr = Number(String(jahrText || "").trim());
      return Number.isFinite(jahr) ? jahr : null;
    }

    function cagrPunkte(cagrProzent, brancheWert) {
      if (brancheWert === "tech") {
        if (cagrProzent < 2.5) return 0;
        if (cagrProzent < 6.3) return 1;
        if (cagrProzent < 7.2) return 2;
        if (cagrProzent < 7.8) return 3;
        if (cagrProzent < 8.7) return 4;
        if (cagrProzent < 9.2) return 5;
        if (cagrProzent < 10.4) return 6;
        if (cagrProzent < 13.3) return 7;
        if (cagrProzent < 14.6) return 8;
        if (cagrProzent <= 15) return 9;
        return 10;
      }

      if (brancheWert === "banken") {
        if (cagrProzent < 1.4) return 0;
        if (cagrProzent < 4.9) return 1;
        if (cagrProzent < 5.9) return 2;
        if (cagrProzent < 6.6) return 3;
        if (cagrProzent < 8.1) return 4;
        if (cagrProzent < 8.7) return 5;
        if (cagrProzent < 10.4) return 6;
        if (cagrProzent < 12.0) return 7;
        if (cagrProzent < 13.6) return 8;
        if (cagrProzent <= 14.0) return 9;
        return 10;
      }

      if (brancheWert === "immobilien") {
        if (cagrProzent < -19.5) return 0;
        if (cagrProzent < -15.5) return 1;
        if (cagrProzent < -11.0) return 2;
        if (cagrProzent < -3.6) return 3;
        if (cagrProzent < 3.2) return 4;
        if (cagrProzent < 5.8) return 5;
        if (cagrProzent < 6.5) return 6;
        if (cagrProzent < 7.6) return 7;
        if (cagrProzent < 9.8) return 8;
        if (cagrProzent <= 10.0) return 9;
        return 10;
      }

      if (brancheWert === "industrie") {
        if (cagrProzent < -6.1) return 0;
        if (cagrProzent < -3.1) return 1;
        if (cagrProzent < 1.1) return 2;
        if (cagrProzent < 3.5) return 3;
        if (cagrProzent < 4.1) return 4;
        if (cagrProzent < 4.7) return 5;
        if (cagrProzent < 5.4) return 6;
        if (cagrProzent < 6.3) return 7;
        if (cagrProzent < 9.7) return 8;
        if (cagrProzent <= 10.0) return 9;
        return 10;
      }

      if (cagrProzent < -6.1) return 0;
      if (cagrProzent < -3.1) return 1;
      if (cagrProzent < 1.1) return 2;
      if (cagrProzent < 3.5) return 3;
      if (cagrProzent < 4.1) return 4;
      if (cagrProzent < 4.7) return 5;
      if (cagrProzent < 5.4) return 6;
      if (cagrProzent < 6.3) return 7;
      if (cagrProzent < 9.7) return 8;
      if (cagrProzent <= 10.0) return 9;
      return 10;
    }

    function standardabweichung(arr) {
      if (!arr.length) return 0;
      const mittelwert = arr.reduce((sum, x) => sum + x, 0) / arr.length;
      const varianz = arr.reduce((sum, x) => sum + ((x - mittelwert) ** 2), 0) / arr.length;
      return Math.sqrt(varianz);
    }

    function stabilitaetPunkte(stabilWerte) {
      const sd = standardabweichung(stabilWerte);
      if (sd < 1.5) return { punkte: 10, sd };
      if (sd < 3) return { punkte: 8, sd };
      if (sd < 5) return { punkte: 6, sd };
      if (sd < 7) return { punkte: 4, sd };
      if (sd < 10) return { punkte: 2, sd };
      return { punkte: 0, sd };
    }

    function baueAnalyseBericht(daten) {
      if (daten.length < 2) {
        return;
      }

      const profil = BRANCHEN_PROFIL[branche] || BRANCHEN_PROFIL.default;
      const erstes = daten[0];
      const letztes = daten[daten.length - 1];
      const startUmsatz = erstes.umsatz;
      const endUmsatz = letztes.umsatz;
      const n = daten.length;

      let cagr = 0;
      let cagrBerechenbar = false;
      if (startUmsatz > 0 && n > 0) {
        cagr = (endUmsatz / startUmsatz) ** (1 / n) - 1;
        cagrBerechenbar = Number.isFinite(cagr);
      }

      const wachstum = daten
        .map((eintrag, index, arr) => {
          if (index === 0) return null;
          const vorher = arr[index - 1].umsatz;
          if (vorher <= 0) return null;
          return ((eintrag.umsatz - vorher) / vorher) * 100;
        })
        .filter((w) => w !== null);

      const cagrProzent = cagrBerechenbar ? cagr * 100 : 0;
      const punkteCagr = cagrBerechenbar ? cagrPunkte(cagrProzent, branche) : 0;
      const stabil = stabilitaetPunkte(wachstum);
      const punkteGesamt = (punkteCagr * profil.cagrGewicht) + (stabil.punkte * profil.stabilGewicht);

      const report = document.createElement("div");
      report.className = "result-card report-card";

      const titel = document.createElement("h2");
      titel.style.marginTop = "0";
      titel.style.marginBottom = "8px";
      titel.style.textAlign = "left";
      titel.textContent = "Analyse Bericht";

      const grid = document.createElement("div");
      grid.className = "report-grid";
      grid.style.gridTemplateColumns = "1fr";

      const zeilen = [
        `CAGR Ergebnis: ${cagrBerechenbar ? cagrProzent.toFixed(2) + "%" : "nicht berechenbar"}`,
        `Umsatzstabilität: ${stabil.sd.toFixed(2)}%`,
        `Gesamtpunkte (gewichtet): ${punkteGesamt.toFixed(2)} / 10`,
      ];

      zeilen.forEach((text) => {
        const p = document.createElement("p");
        p.className = "report-line";
        p.textContent = text;
        grid.appendChild(p);
      });

      report.appendChild(titel);
      report.appendChild(grid);

      container.parentElement.insertBefore(report, container);
    }

    ergebnisse.forEach((eintrag, index) => {
      const ek = Number(eintrag.ek || 0);
      const bs = Number(eintrag.bs || 0);
      const restAktiva = Math.max(bs - ek, 0);
      const overview = eintrag.overview || {};
      const fremdkapital = Number(overview["Fremdkapital"] ?? overview["Freumdkapital"] ?? 0);

      let verschuldungsgradText = "Der Verschuldungsgrad beträgt nicht berechenbar";
      if (ek > 0) {
        const verschuldungsgrad = (fremdkapital / ek) * 100;
        verschuldungsgradText = `Der Verschuldungsgrad beträgt ${verschuldungsgrad.toFixed(2)}%`;
      }

      const block = document.createElement("div");
      block.className = "result-card";

      const titel = document.createElement("h2");
      titel.style.textAlign = "center";
      titel.style.fontSize = "20px";
      titel.style.marginBottom = "10px";
      titel.textContent = eintrag.gj ? `GJ ${eintrag.gj}` : "Ergebnis";

      const text = document.createElement("p");
      text.style.fontSize = "18px";
      text.style.marginBottom = "20px";
      text.textContent = eintrag.msg || "Keine Daten gefunden.";

      const canvas = document.createElement("canvas");
      canvas.id = `eq-chart-${index}`;
      canvas.width = 400;
      canvas.height = 400;
      canvas.style.maxWidth = "400px";
      canvas.style.display = "block";
      canvas.style.margin = "0 auto";

      const verschuldungsgradP = document.createElement("p");
      verschuldungsgradP.style.textAlign = "center";
      verschuldungsgradP.style.fontSize = "17px";
      verschuldungsgradP.style.marginTop = "12px";
      verschuldungsgradP.style.marginBottom = "12px";
      verschuldungsgradP.textContent = verschuldungsgradText;

      block.appendChild(titel);
      block.appendChild(text);
      block.appendChild(canvas);
      block.appendChild(verschuldungsgradP);

      const tableTitle = document.createElement("h3");
      tableTitle.style.textAlign = "center";
      tableTitle.style.fontSize = "18px";
      tableTitle.style.marginTop = "25px";
      tableTitle.style.marginBottom = "12px";
      tableTitle.textContent = eintrag.gj ? `Financel Overview ${eintrag.gj}` : "Financel Overview";

      const table = document.createElement("table");
      table.style.width = "100%";
      table.style.maxWidth = "640px";
      table.style.margin = "0 auto";
      table.style.borderCollapse = "collapse";
      table.style.background = "#1f2f40";
      table.style.border = "1px solid #36516b";

      const kopf = document.createElement("tr");
      const kopfLinks = document.createElement("th");
      kopfLinks.textContent = "Kennzahl";
      kopfLinks.style.padding = "10px";
      kopfLinks.style.textAlign = "left";
      kopfLinks.style.borderBottom = "1px solid #36516b";

      const kopfRechts = document.createElement("th");
      kopfRechts.textContent = "Wert";
      kopfRechts.style.padding = "10px";
      kopfRechts.style.textAlign = "right";
      kopfRechts.style.borderBottom = "1px solid #36516b";

      kopf.appendChild(kopfLinks);
      kopf.appendChild(kopfRechts);
      table.appendChild(kopf);

      const zeilen = [
        ["Gesamtumsatz", overview["Gesamtumsatz"]],
        ["EBITA", overview["EBITA"]],
        ["Jahresüberschuss", overview["Jahresüberschuss"]],
        ["Bilanzsumme", overview["Bilanzsumme"]],
        ["Eigenkapital", overview["Eigenkapital"]],
        ["Fremdkapital", overview["Fremdkapital"] ?? overview["Freumdkapital"]],
        ["Cash", overview["Cash"]],
      ];

      zeilen.forEach((eintragZeile) => {
        const tr = document.createElement("tr");

        const tdName = document.createElement("td");
        tdName.textContent = eintragZeile[0];
        tdName.style.padding = "10px";
        tdName.style.borderBottom = "1px solid #2b4157";

        const tdWert = document.createElement("td");
        tdWert.textContent = formatWert(eintragZeile[0], eintragZeile[1]);
        tdWert.style.padding = "10px";
        tdWert.style.textAlign = "right";
        tdWert.style.borderBottom = "1px solid #2b4157";

        tr.appendChild(tdName);
        tr.appendChild(tdWert);
        table.appendChild(tr);
      });

      block.appendChild(tableTitle);
      block.appendChild(table);
      container.appendChild(block);

      if (!(ek > 0 || bs > 0)) {
        return;
      }

      new Chart(canvas, {
        type: "pie",
        plugins: [ChartDataLabels],
        data: {
          labels: ["Eigenkapital", "Restliche Aktiva"],
          datasets: [{
            data: [ek, restAktiva],
            backgroundColor: ["#4a90e2", "#e25c4a"],
            borderColor: ["#1a2a3a", "#1a2a3a"],
            borderWidth: 2
          }]
        },
        options: {
          plugins: {
            legend: { labels: { color: "#e8eef6", font: { size: 14 } } },
            datalabels: {
              color: "#ffffff",
              font: { size: 14, weight: "bold" },
              formatter: (value, ctx) => {
                const total = ctx.chart.data.datasets[0].data.reduce((a, b) => a + b, 0);
                if (total === 0) {
                  return "0.0%";
                }
                return (value / total * 100).toFixed(1) + "%";
              }
            }
          }
        }
      });
    });

    const trendDaten = ergebnisse
      .map((eintrag) => {
        const overview = eintrag.overview || {};
        return {
          gj: String(eintrag.gj || "").trim(),
          umsatz: Number(overview["Gesamtumsatz"] || 0),
          eigenkapital: Number(overview["Eigenkapital"] ?? eintrag.ek ?? 0)
        };
      })
      .filter((eintrag) => eintrag.gj !== "")
      .sort((a, b) => {
        const aJahr = parseJahrWert(a.gj);
        const bJahr = parseJahrWert(b.gj);

        if (aJahr !== null && bJahr !== null) {
          return aJahr - bJahr;
        }
        return a.gj.localeCompare(b.gj, "de");
      });

    baueAnalyseBericht(trendDaten);

    baueKennzahlenTabelle(
      [...ergebnisse].sort((a, b) => String(a.gj || "").localeCompare(String(b.gj || ""), "de", { numeric: true }))
    );

    if (trendDaten.length > 0) {
      const jahre = trendDaten.map((eintrag) => eintrag.gj);
      const eigenkapitalWerte = trendDaten.map((eintrag) => eintrag.eigenkapital);

      const umsatzwachstumWerte = trendDaten.map((eintrag, index, arr) => {
        if (index === 0) {
          return null;
        }

        const vorher = arr[index - 1].umsatz;
        if (vorher <= 0) {
          return null;
        }

        return ((eintrag.umsatz - vorher) / vorher) * 100;
      });

      const trendCard = document.createElement("div");
      trendCard.className = "result-card trend-card";

      const trendTitle = document.createElement("h2");
      trendTitle.style.textAlign = "center";
      trendTitle.style.fontSize = "20px";
      trendTitle.style.marginBottom = "14px";
      trendTitle.textContent = "Umsatzwachstum und Eigenkapitalentwicklung";

      const trendWrap = document.createElement("div");
      trendWrap.className = "trend-chart-wrap";

      const trendCanvas = document.createElement("canvas");
      trendCanvas.id = "trend-chart";

      trendWrap.appendChild(trendCanvas);
      trendCard.appendChild(trendTitle);
      trendCard.appendChild(trendWrap);
      container.parentElement.appendChild(trendCard);

      new Chart(trendCanvas, {
        type: "line",
        data: {
          labels: jahre,
          datasets: [
            {
              label: "Umsatzwachstum (%)",
              data: umsatzwachstumWerte,
              yAxisID: "yPercent",
              borderColor: "#4a90e2",
              backgroundColor: "rgba(74, 144, 226, 0.2)",
              borderWidth: 3,
              tension: 0.3,
              pointRadius: 4,
              pointHoverRadius: 6,
              spanGaps: true
            },
            {
              label: "Eigenkapital (EUR)",
              data: eigenkapitalWerte,
              yAxisID: "yEuro",
              borderColor: "#5dbf8a",
              backgroundColor: "rgba(93, 191, 138, 0.2)",
              borderWidth: 3,
              tension: 0.3,
              pointRadius: 4,
              pointHoverRadius: 6
            }
          ]
        },
        options: {
          maintainAspectRatio: false,
          interaction: {
            mode: "index",
            intersect: false
          },
          plugins: {
            legend: {
              labels: {
                color: "#e8eef6",
                font: { size: 13 }
              }
            },
            datalabels: {
              display: false
            },
            tooltip: {
              callbacks: {
                label: (ctx) => {
                  const label = ctx.dataset.label || "";
                  const value = ctx.parsed.y;

                  if (ctx.dataset.yAxisID === "yPercent") {
                    if (value === null || Number.isNaN(value)) {
                      return `${label}: keine Basis`;
                    }
                    return `${label}: ${value.toFixed(2)}%`;
                  }

                  return `${label}: ${formatEuro(value)}`;
                }
              }
            }
          },
          scales: {
            x: {
              ticks: { color: "#c8ddf5" },
              grid: { color: "rgba(200, 221, 245, 0.12)" }
            },
            yPercent: {
              type: "linear",
              position: "left",
              ticks: {
                color: "#4a90e2",
                callback: (value) => `${value}%`
              },
              grid: { color: "rgba(200, 221, 245, 0.12)" }
            },
            yEuro: {
              type: "linear",
              position: "right",
              ticks: {
                color: "#5dbf8a",
                callback: (value) => formatEuro(value)
              },
              grid: {
                drawOnChartArea: false
              }
            }
          }
        }
      });
    }
  </script>
</body>
</html>
